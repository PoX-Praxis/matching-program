## render.yaml — PoX Render デプロイ設定
##
## ⚠️  Render 無料 PostgreSQL は 30 日で失効します（2024年ポリシー）。
##     常設データが必要なら databases[0].plan を "starter"（$7/月）に変更してください。
##     Web サービス（pox-web）は free のままでも動作します。
##
## セットアップ手順:
##   1. GitHub リポジトリを Render に接続し、このファイルがあるブランチを選択。
##   2. Render ダッシュボードで pox-web の環境変数 ANTHROPIC_API_KEY を手入力。
##      （sync: false のためコードにもこのファイルにも値は入らない）
##   3. push するたびに自動デプロイ。DB は再デプロイで消えない。

services:
  - type: web
    name: pox-web
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --workers 1 --timeout 120"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pox-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false          # Render ダッシュボードで手入力。コードにもここにも値を書かない。
      - key: PYTHON_VERSION
        value: "3.12"
      - key: POX_DEBUG
        value: "0"
      ## 同一性の鍵（指示書26 §1-3）。POX_SECRET_KEY とは必ず別値にする。
      ##   POX_SECRET_KEY … セッション署名鍵。漏洩時は即差し替えてよい（再ログインで回復）。
      ##   POX_EMAIL_SALT … email_hash のソルト。差し替えると全アカウントが到達不能になる。
      ##                    絶対に変更しない・バックアップ必須。未設定だと本番は起動しない。
      - key: POX_SECRET_KEY
        sync: false          # Render ダッシュボードで手入力。
      - key: POX_EMAIL_SALT
        sync: false          # 手入力。一度決めたら二度と変えない（変更＝全アカウント喪失）。
      ## メール送信（マジックリンク）。POX_MAIL_BACKEND で方式を切替。
      ## Render がアウトバウンド SMTP を塞いでおり TCP が TimeoutError になるため、
      ## HTTPS(443) で送れる Resend HTTP API を既定にした（経緯は docs/email_login_operations.md）。
      - key: POX_MAIL_BACKEND
        value: "resend_api"  # "resend_api"（既定・HTTP API）/ "smtp"（将来の別サービス用）
      ## resend_api バックエンド用（既定）。未設定だと開発モード＝一通も送信されない。
      - key: POX_RESEND_API_KEY
        sync: false          # Resend の API キー（re_...）。ダッシュボードで手入力。
      - key: POX_MAIL_FROM
        sync: false          # 例 noreply@pox-praxis.com（独自ドメイン・SPF/DKIM/DMARC 設定済み）
      ## smtp バックエンド用（将来の別サービス用に残す）。resend_api では不要。
      ## 465/2465 は暗黙TLS、25/587/2587 は STARTTLS（mailer.py が自動切替）。
      - key: POX_SMTP_HOST
        sync: false
      - key: POX_SMTP_USER
        sync: false
      - key: POX_SMTP_PASS
        sync: false
      - key: POX_SMTP_PORT
        sync: false          # 未設定なら 587
      - key: POX_SMTP_FROM
        sync: false          # 既定は POX_SMTP_USER

  ## 日次 root バッチ（指示書17 §6）。1日1回 UTC 00:10 に scripts/daily_anchor.py を実行。
  ## イベントゼロの日も空 root を記録し、落ちた日は次回にバックフィルされる（gap 無し）。
  ## ⚠️ Render の Cron Job は有料プラン機能です。無料で回すなら本サービスは使わず、
  ##    無料の外部スケジューラ（cron-job.org / GitHub Actions 等）から
  ##    POST /ledger/anchor に X-Anchor-Token: <POX_ANCHOR_TOKEN> を付けて叩く運用でも可。
  - type: cron
    name: pox-anchor
    runtime: python
    plan: starter
    schedule: "10 0 * * *"     # 毎日 00:10 UTC
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python scripts/daily_anchor.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pox-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12"

databases:
  - name: pox-db
    plan: free               # ⚠️ 30 日失効。常設運用は "starter" ($7/月) を推奨。
    postgresMajorVersion: "16"
