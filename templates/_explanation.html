{#- 接続の説明（指示書68 段階1）の共通の見た目と、小さな描き方の部品。
    プロフィール（画面1・2）・受信箱（画面3）・つながる（一覧）が include する。
    本文の HTML はサーバーのレンダラ（src/explanation.py）が作る。ここに例文を直接書かない。
    数値・上層の印は出さない。 -#}
<style>
  .ex-card { border: 1px solid #dfe3e8; border-radius: 8px; padding: 12px 14px; margin: 8px 0; line-height: 1.75; font-size: 14px; }
  .ex-who { font-size: 15px; font-weight: 700; margin: 0 0 6px; }
  .ex-ph { font-size: 14.5px; margin: 14px 0 4px; }
  .ex-purpose:first-child .ex-ph { margin-top: 2px; }
  .ex-meaning { margin: 4px 0 6px; }
  .ex-sub { color: #666; font-size: 12.5px; margin: 10px 0 4px; }
  .ex-revh { margin-top: 18px; border-top: 1px dashed #dfe3e8; padding-top: 10px; }
  .ex-els, .ex-unk { margin: 0; padding: 0; }
  .ex-el { list-style: none; border-left: 3px solid #c9d6e3; padding: 2px 0 2px 10px; margin: 8px 0; }
  .ex-k { font-size: 12.5px; color: #454b54; }
  .ex-pair { font-size: 13.5px; }
  .ex-q { color: #1f2329; }
  .ex-src { display: inline; margin-left: 4px; }
  .ex-src summary { display: inline; cursor: pointer; font-size: 11.5px; color: #1a3a5c; text-decoration: underline; }
  .ex-src[open] .ex-src-text { display: block; margin: 2px 0 4px; padding: 4px 8px; background: #f6f7f9; border-radius: 4px; font-size: 12.5px; color: #333; }
  .ex-rel { color: #2a6a3a; font-size: 12.5px; }
  .ex-unk li { list-style: none; font-size: 13px; color: #454b54; margin: 2px 0; }
  .ex-unk li::before { content: "・"; }
  .ex-nc { color: #454b54; font-size: 13.5px; }
  /* v0.5（指示書71）: 要旨・目的ごとの状態の 1 行・根拠は開く形 */
  .ex-summary { font-weight: 700; font-size: 14px; margin: 0 0 8px; }
  .ex-state { color: #454b54; font-size: 13px; margin: 2px 0 4px; }
  .ex-basis { margin: 2px 0 6px; }
  .ex-basis > summary { cursor: pointer; font-size: 12.5px; color: #1a3a5c; list-style: none; display: inline-block; padding: 2px 0; }
  .ex-basis > summary::-webkit-details-marker { display: none; }
  .ex-basis > summary:hover { text-decoration: underline; }
  .ex-cite { font-size: 10.5px; color: #1a3a5c; margin-left: 1px; }
  .ex-stale { font-size: 12.5px; color: #7a5a10; background: #fbf5ec; padding: 4px 8px; border-radius: 4px; }
  .ex-supp { font-size: 13.5px; background: #f3f7fb; padding: 6px 10px; border-radius: 6px; }
  .ex-foot { color: #777; font-size: 12px; margin: 14px 0 2px; }
  .ex-supp-btn { background: none; border: none; color: #1a3a5c; cursor: pointer; font-size: 13px; display: block; margin: 2px 0 0 auto; padding: 0; }
  .ex-supp-btn:hover { text-decoration: underline; }
  .ex-deleted { color: #888; }
  .ex-cap { font-size: 12.5px; color: #555; margin: 6px 0 2px; }
  .ex-supp-box { margin: 6px 0; }
  .ex-supp-box textarea { width: 100%; box-sizing: border-box; font-size: 13px; }
  .ex-supp-box .ex-supp-note { font-size: 12px; color: #666; margin: 2px 0; }
  .ex-check { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; margin: 10px 0 2px; }
  .ex-list-item { border-bottom: 1px solid #eee; padding: 10px 2px; }
  .ex-list-item a.ex-name { font-weight: 700; font-size: 14.5px; }
  .ex-list-item .ex-lh { font-size: 13px; color: #454b54; margin-top: 2px; }
  .ex-list-item .ex-lm { font-size: 13.5px; margin-top: 2px; }
  .ex-pager { display: flex; gap: 12px; margin-top: 10px; font-size: 13px; }
  .ex-pager button { background: none; border: 1px solid #cfd3d9; border-radius: 6px; padding: 4px 12px; cursor: pointer; }
</style>
<script>
/* 接続の説明の小さな部品（PoXExplain）。本文の HTML はサーバーが作ったものをそのまま入れる。 */
window.PoXExplain = (function () {
  const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const SUPP_MAX = 400;

  /* 「補足する ›」を押すと、カードの下に補足の欄を開く（400 字まで）。onSend が無ければ欄を開くだけ（承認・見送りに添える）。 */
  function wireSupplement(root, opts) {
    const btn = root.querySelector(".ex-supp-btn");
    if (!btn) return null;
    const box = document.createElement("div");
    box.className = "ex-supp-box";
    box.style.display = "none";
    box.innerHTML = `<p class="ex-supp-note">${esc(opts.note || "")}</p>
      <textarea maxlength="${SUPP_MAX}" rows="3"></textarea>
      ${opts.onSend ? '<button type="button" class="ex-supp-send">補足を送る</button> <span class="ex-supp-msg"></span>' : ""}`;
    root.appendChild(box);
    btn.addEventListener("click", () => {
      box.style.display = box.style.display === "none" ? "" : "none";
      if (box.style.display === "") box.querySelector("textarea").focus();
    });
    if (opts.onSend) {
      box.querySelector(".ex-supp-send").addEventListener("click", async () => {
        const t = box.querySelector("textarea").value.trim();
        const msg = box.querySelector(".ex-supp-msg");
        if (!t) return;
        msg.textContent = (await opts.onSend(t)) ? "送りました" : "送れませんでした";
        if (msg.textContent === "送りました") box.querySelector("textarea").value = "";
      });
    }
    return box.querySelector("textarea");
  }

  /* 一覧の 1 件（短い形: 名前・目的の見出し・① の 1 文）。開くと画面1 の全体（相手のプロフィール）。 */
  function listItemHtml(it) {
    const first = (it.items || [])[0] || {};
    return `<div class="ex-list-item"><a class="ex-name" href="${esc(it.href)}">${esc(it.name)}</a>
      <div class="ex-lh">■ ${first.head || ""}</div><div class="ex-lm">${first.meaning || ""}</div></div>`;
  }

  return { esc, wireSupplement, listItemHtml, SUPP_MAX };
})();
</script>
