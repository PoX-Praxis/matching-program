{#- 照合の根拠（「なぜこの人か」）と申し出の文の共通描画（指示書55・55-5）。
    つながる（照合の結果のカード）・受信箱・マイページの接続カード・プロフィールの承認欄が include する。
    - 根拠は「軸の名前＋両者の公開本文」の固定文だけ。数値・順位・LLM の理由文は出さない。
    - 申し出の文は、受けた本人にだけサーバーが返す（GET /api/my/offers）。 -#}
<style>
  .mr-axis { font-size: 12px; font-weight: bold; }
  .mr-axis.will { color: #1a56bb; } .mr-axis.fill { color: #1a6a3a; } .mr-axis.mutual { color: #7a4a1a; }
  .mr-line { font-size: 13px; color: #333; line-height: 1.6; margin-top: 2px; }
  .mr-line .mr-k { font-size: 12px; color: #555; }
  .mr-line .mr-arrow { color: #8a96a8; padding-left: 1em; line-height: 1.2; }
  .mr-line + .mr-line { margin-top: 8px; }
  .mr-takes { display: block; font-size: 11.5px; color: #7a4a1a; }
  .mr-note { font-size: 11.5px; color: #888; margin-top: 4px; }
  .mr-more { display: inline; font-size: 12px; color: #555; }
  .mr-more > summary { display: inline; cursor: pointer; color: #1a3a5c; margin-left: 4px; white-space: nowrap; }
  .mr-more[open] { display: block; white-space: pre-wrap; padding-left: 1em; }
  .mr-offer { font-size: 12.5px; color: #444; margin-top: 4px; white-space: pre-wrap;
              border-left: 3px solid #d5dae1; padding-left: 8px; }
  .mr-offer .k { display: block; font-size: 11px; color: #888; }
  .mr-compose textarea { width: 100%; box-sizing: border-box; font-size: 13px; margin-top: 4px; }
  .mr-compose label { font-size: 12px; color: #555; }
</style>
<script>
window.PoXReason = (function () {
  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => (
      {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  /* 利用者に見せる軸は 2 つ（意志が近い／足りないところを埋める）＋双方向の補完（55-5 §5 で文言を変更）。 */
  const AXIS = {
    will:   "意志が近い",
    fill:   "足りないところを埋める",
    mutual: "足りないところを互いに埋める",
  };
  /* 根拠は常に「必要像の文 ↔ 与え像の文（無ければ現状の欄）」の引用の対（指示書61 §3）。数値は出さない。
     見出し（need_label / offer_label）はサーバーが付ける。照合のカード:
       あなたが必要としていること：…
       　↑
       相手が力になれること：…
     承認の画面は補完B（相手があなたに求めていること ↔ あなたが力になれること）が先（サーバーが並べる）。 */
  /* 引用は**文の区切りまで**で切る（指示書58 1-5）。行数の丸め（CSS の clamp）は語の途中で切れて意味の核が消えるため
     使わない。区切り＝「。」「！」「？」・改行・現状のスロットの境目（" / "）。最初の区切りまでを出し、残りがあれば
     「全文を見る」で開く（切り詰めない・新しい画面は作らない）。区切りが無い文は丸ごと出す。 */
  function cut(t) {
    const s = String(t ?? "");
    const m = s.match(/^[\s\S]*?(?:[。！？!?]|\n| \/ )/);
    if (!m || m[0].length >= s.trim().length) return { head: s, rest: "" };
    return { head: m[0].replace(/(\n| \/ )$/, ""), rest: s.slice(m[0].length).trim() };
  }
  function quote(t) {
    const q = cut(t);
    const more = q.rest ? `<details class="mr-more"><summary>全文を見る</summary>${esc(q.rest)}</details>` : "";
    return `「${esc(q.head)}${q.rest ? "…" : ""}」${more}`;
  }
  function line(x) {
    if (!x || !x.need || !x.offer) return "";
    const takes = x.takes_on ? `<span class="mr-takes">承認すると、これを引き受けます</span>` : "";
    return `<div class="mr-line"><div class="mr-need"><span class="mr-k">${esc(x.need_label)}</span>：${quote(x.need)}</div>`
         + `<div class="mr-arrow" aria-hidden="true">↑</div>`
         + `<div class="mr-give"><span class="mr-k">${esc(x.offer_label)}</span>：${quote(x.offer)}${takes}</div></div>`;
  }
  /* 根拠（axis と reasons）を HTML にする。無ければ空文字。 */
  function reasonHtml(r) {
    if (!r || !AXIS[r.axis]) return "";
    const note = r.current_profile ? `<div class="mr-note">現在のプロフィールにもとづく</div>` : "";
    return `<div class="mr-axis ${r.axis}">${AXIS[r.axis]}</div>` + (r.reasons || []).map(line).join("") + note;
  }
  /* 申し出の文（受けた本人だけに届く）。 */
  function offerHtml(text) {
    if (!text) return "";
    return `<div class="mr-offer"><span class="k">申し出の文</span>${esc(text)}</div>`;
  }
  /* 承認の場面の根拠をサーバーから取る（その場で再計算）。取れなければ null。 */
  async function fetchReason(otherId) {
    try {
      const r = await fetch(`/api/connections/reason?with=${encodeURIComponent(otherId)}`);
      if (!r.ok) return null;
      return (await r.json()).reason || null;
    } catch (e) { return null; }
  }
  /* 自分宛ての申し出の文 {申し出た人: 文}。 */
  async function fetchOffers() {
    try {
      const r = await fetch("/api/my/offers");
      if (!r.ok) return {};
      return Object.fromEntries((await r.json()).map(o => [o.from, o.message || ""]));
    } catch (e) { return {}; }
  }
  /* 申し出の文の入力欄（任意・400 字。経路によらず同じ）。 */
  function composeHtml(id) {
    return `<div class="mr-compose"><label for="${id}">なぜつながりたいか（任意・400字まで。相手だけが読めます）</label>
      <textarea id="${id}" maxlength="400" rows="2"></textarea></div>`;
  }
  return { esc, AXIS, cut, reasonHtml, offerHtml, fetchReason, fetchOffers, composeHtml };
})();
</script>
