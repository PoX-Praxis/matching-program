<nav style="background:#1a3a5c;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;margin-bottom:24px">
  <a href="/" style="color:white;font-weight:bold;text-decoration:none;font-size:1.1rem">PoX</a>
  <div style="display:flex;gap:16px;align-items:center">
    <a href="/register" style="color:#cde">登録</a>
    <a href="/connect" id="navMatch" style="color:#cde">つながる</a>
    <a href="/communities" style="color:#cde">コミュニティ</a>
    <a href="/about" style="color:#cde">PoXとは</a>
    <a href="#" id="navInbox" style="color:#cde">インボックス</a>
    <a href="#" id="navMyPage" style="color:#cde">マイページ</a>
    <span id="navId" style="color:#aaa;font-size:12px"></span>
  </div>
</nav>
<script>
(function(){
  const id = localStorage.getItem("pox_my_id");
  if (id) {
    document.getElementById("navMyPage").href = `/mypage?id=${encodeURIComponent(id)}`;
    document.getElementById("navInbox").href  = `/inbox?id=${encodeURIComponent(id)}`;
    document.getElementById("navId").textContent = id;
  }
  const path = location.pathname;
  const map = {
    "/connect": "navMatch",
    "/register": null,
    "/communities": null,
    "/about": null,
    "/inbox": "navInbox",
    "/mypage": "navMyPage"
  };
  const activeId = map[path];
  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) el.style.color = "#fff";
  } else {
    document.querySelectorAll("nav a[href='" + path + "']").forEach(function(a){ a.style.color = "#fff"; });
  }
})();
</script>
