<style>
  /* ── 共通トークン（指示書29 §2-2）── _nav.html は全ページに include されるため、
     ここが「1枚の共通CSS」の集約点。配色・本文幅・フォントを変数化し、各ページは
     これを参照する。既存の個別 <style> を壊さないよう全体上書き（button/h1 等）はしない。 */
  :root{
    --pox-content:620px;     /* 本文幅の標準（generic ページ） */
    --pox-font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  }
  /* 状態表示の共通ヘルパ（§2-3・opt-in）。空/読み込み中/エラーの淡色表現をそろえる。 */
  .pox-state{ color:var(--text-muted); font-size:13px; line-height:1.8; }
  .pox-empty{ color:var(--text-muted); font-size:13px; line-height:1.8; }

  /* リボン（ナビ帯）を全ページで画面の端までそろえる（body の max-width/margin/padding に依存させない）。
     一部ページは body が中央寄せの枠のため帯が端まで届かなかった → 全幅・上端そろえに統一。 */
  #poxNav{ box-sizing:border-box; width:100vw; margin-left:calc(50% - 50vw); margin-right:calc(50% - 50vw); margin-top:0; }
  body{ margin-top:0 !important; }

  /* ── スマホ対応（全ページ共通）── 横幅は各 body の max-width が流動的に縮む。
     ここでは端末幅で崩れやすい要素だけを整える。 */
  html, body{ max-width:100%; overflow-x:hidden; }   /* 100vw リボン由来の横スクロールを抑止 */
  img{ max-width:100%; height:auto; }
  /* 表示の切り替えのボタン（指示書75 §4）。いまの表示に合わせて、月か太陽の一方だけを出す */
  .pox-theme-btn{ background:none; border:none; color:var(--nav-sub); padding:2px; margin:0; cursor:pointer;
                  line-height:0; display:inline-flex; align-items:center; }
  .pox-theme-btn:hover{ color:var(--nav-text); }
  :root[data-theme="dark"] .pox-theme-btn .pox-moon{ display:none; }
  :root:not([data-theme="dark"]) .pox-theme-btn .pox-sun{ display:none; }
  /* 狭い幅（430 以下）では、ナビに入らないので ☰ の中の 1 行にする（報告75 の案 B） */
  .pox-theme-menu{ display:none; width:100%; text-align:left; padding:9px 10px; color:var(--link); background:none;
                   border:none; border-radius:4px; cursor:pointer; font:inherit; }
  .pox-theme-menu svg{ vertical-align:-3px; margin-right:6px; }
  :root[data-theme="dark"] .pox-theme-menu .pox-moon{ display:none; }
  :root:not([data-theme="dark"]) .pox-theme-menu .pox-sun{ display:none; }
  @media (max-width:430px){
    #poxNav .pox-theme-btn{ display:none; }
    #poxNav .pox-theme-menu{ display:block; }
  }
  @media (max-width:640px){
    #poxNav{ padding:10px 12px; }
    #poxNav > div{ gap:11px; }
    #poxNav a, #poxNav button{ font-size:13px; }
    /* 幅広の表・整形テキスト・チャットは要素内で横スクロール（ページ全体は横に伸ばさない） */
    table{ display:block; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    pre{ overflow-x:auto; }
    #navMenu{ min-width:min(240px, calc(100vw - 24px)); }
  }
  @media (max-width:400px){
    #poxNav > div{ gap:8px; }
    #poxNav a, #poxNav button{ font-size:12px; }
  }
</style>
<nav id="poxNav" style="background:var(--nav-bg);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;position:relative">
  <a href="/" style="color:var(--nav-text);font-weight:bold;text-decoration:none;font-size:1.1rem">PoX</a>
  <div style="display:flex;gap:16px;align-items:center;position:relative">
    <!-- 常に表示する主要導線（厳選）。他は右端の ☰ に折り畳む。
         「言語化する」は登録前の人にもイメージが湧くよう常時表示（つながるの左）。 -->
    <a href="/register" id="navWrite" style="color:var(--nav-sub);text-decoration:none;white-space:nowrap">言語化する</a>
    <a href="/connect" id="navMatch" style="color:var(--nav-sub);text-decoration:none;white-space:nowrap">つながる</a>
    <a href="/communities" id="navCommunities" style="color:var(--nav-sub);text-decoration:none;white-space:nowrap">コミュニティ</a>
    <!-- 表示の切り替え（指示書75 §4）。明るい表示では月（押すと暗くなる）、暗い表示では太陽（押すと明るくなる）。
         選んだほうは、その人のブラウザの中（localStorage）だけに覚える。 -->
    <button type="button" id="navTheme" class="pox-theme-btn" aria-label="表示を暗くする" title="表示を暗くする">
      <svg class="pox-moon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <svg class="pox-sun" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M5.3 18.7 7 17M17 7l1.7-1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <!-- 未ログイン時のみ表示（ログイン後は非表示にして ☰ 内のログアウトへ） -->
    <a href="/login" id="navLogin" style="color:var(--nav-sub);text-decoration:none;white-space:nowrap">ログイン</a>
    <button id="navMenuBtn" aria-label="メニュー" aria-expanded="false"
            style="background:none;border:1px solid var(--nav-sub);color:var(--nav-sub);border-radius:4px;padding:2px 10px;font-size:16px;cursor:pointer;line-height:1.5">☰</button>
    <div id="navMenu" hidden
         style="position:absolute;top:100%;right:0;margin-top:8px;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;box-shadow:0 6px 24px var(--shadow);min-width:200px;padding:6px;z-index:200">
      <!-- hidden 項目は inline display を付けない（display:block は hidden の既定 display:none を上書きしてしまうため）。表示は JS で style.display を付与する。 -->
      <div id="navMenuId" hidden style="font-size:11px;color:var(--text-muted);padding:6px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;word-break:break-all"></div>
      <a href="#" id="menuInbox" hidden style="padding:9px 10px;color:var(--link);text-decoration:none;border-radius:4px">受信箱</a>
      <a href="#" id="menuMypage" hidden style="padding:9px 10px;color:var(--link);text-decoration:none;border-radius:4px">マイページ</a>
      <a href="/about" style="display:block;padding:9px 10px;color:var(--link);text-decoration:none;border-radius:4px">PoXとは</a>
      <a href="/privacy" style="display:block;padding:9px 10px;color:var(--link);text-decoration:none;border-radius:4px">プライバシー</a>
      <!-- 表示の切り替え（狭い幅だけ。広い幅ではナビのボタン。指示書75 §4・報告75 の案 B） -->
      <button type="button" id="menuTheme" class="pox-theme-menu" aria-label="表示を暗くする"><svg class="pox-moon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><svg class="pox-sun" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M5.3 18.7 7 17M17 7l1.7-1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="pox-theme-label">表示を暗くする</span></button>
      <a href="#" id="menuLogout" hidden style="padding:9px 10px;color:var(--error-text);text-decoration:none;border-radius:4px;border-top:1px solid var(--line);margin-top:4px">ログアウト</a>
    </div>
  </div>
</nav>
<script>
/* ══ PoX 共通クライアントヘルパ（指示書25）══════════════════════════════════
   同一性の根拠はセッション。フロントは自分の id を送らず、サーバーが取る。
   localStorage.pox_my_id は表示上の利便のみ（認可には使わない・§2-2）。 */
window.PoX = (function(){
  let _me = undefined;   // undefined=未取得 / null=未ログイン / "id"=ログイン済み
  async function me() {
    if (_me !== undefined) return _me;
    try {
      const r = await fetch("/api/me");
      _me = r.ok ? ((await r.json()).subject_id || null) : null;   // 401=未ログイン
    } catch (e) { _me = null; }
    return _me;
  }
  function loginRedirect() {
    const next = encodeURIComponent(location.pathname + location.search);
    location.href = "/login?next=" + next;      // ログイン後、元画面へ戻す（§4-2）
  }
  /* ゲートされた fetch の応答を共通処理する。処理済みなら true を返す（呼び出し側は中断）。
     401 → /login へ（現画面を next に）／403 → 権限エラー表示・/login には飛ばさない。 */
  function handle(res, opts) {
    opts = opts || {};
    if (!res) return false;
    if (res.status === 401) { loginRedirect(); return true; }
    if (res.status === 403) {
      const msg = "この操作を行う権限がありません。";
      if (typeof opts.on403 === "function") opts.on403(msg); else alert(msg);
      return true;
    }
    return false;
  }
  return { me, handle, loginRedirect };
})();

(function(){
  // ── ☰ メニューの開閉 ───────────────────────────────────────────────
  var btn = document.getElementById("navMenuBtn");
  var menu = document.getElementById("navMenu");
  function closeMenu(){ menu.hidden = true; btn.setAttribute("aria-expanded","false"); }
  btn.addEventListener("click", function(e){
    e.stopPropagation();
    var open = menu.hidden;
    menu.hidden = !open;
    btn.setAttribute("aria-expanded", String(open));
  });
  document.addEventListener("click", function(e){
    if (!menu.hidden && !menu.contains(e.target) && e.target !== btn) closeMenu();
  });

  // ── ログイン状態による表示分け（未ログイン/ログイン後）──────────────────
  // 既定は「未ログイン」表示（ログインリンクを出し、本人限定項目は隠す）。
  // セッションが実在するときだけ本人向けに反転する＝localStorage の残骸で
  // 「ログイン中」表示になる不具合（未ログインなのに右上に id が出る）を防ぐ。
  PoX.me().then(function(sid){
    var login   = document.getElementById("navLogin");
    var idBox   = document.getElementById("navMenuId");
    var mInbox  = document.getElementById("menuInbox");
    var mMypage = document.getElementById("menuMypage");
    var mLogout = document.getElementById("menuLogout");
    if (sid) {
      // ログイン後: ログインリンクを隠し、本人限定項目を出す。id はセッション値のみ表示。
      if (login) login.hidden = true;
      idBox.textContent = "ログイン中: " + sid; idBox.hidden = false;
      mInbox.hidden  = false; mInbox.style.display  = "block"; mInbox.href  = "/inbox?id="  + encodeURIComponent(sid);
      mMypage.hidden = false; mMypage.style.display = "block"; mMypage.href = "/mypage?id=" + encodeURIComponent(sid);
      mLogout.hidden = false; mLogout.style.display = "block";
      mLogout.onclick = async function(e){
        e.preventDefault();
        try { await fetch("/auth/logout", {method:"POST"}); } catch(_){}
        try { localStorage.removeItem("pox_my_id"); } catch(_){}
        location.href = "/about";
      };
    } else {
      // 未ログイン: ログインリンクのみ。本人限定項目（登録/受信箱/マイページ/ログアウト/id）は隠したまま。
      if (login) login.hidden = false;
    }
  });

  // ── 表示の切り替え（指示書75 §4）。ボタンで選んだほうを localStorage だけに覚える（サーバー・クッキーには残さない）──
  // 広い幅はナビのボタン（navTheme）、狭い幅（430 以下）は ☰ の中の 1 行（menuTheme）。どちらも同じ切り替え
  var themeBtn = document.getElementById("navTheme");
  var themeMenu = document.getElementById("menuTheme");
  function syncThemeBtn(){
    var dark = document.documentElement.getAttribute("data-theme") === "dark";
    var label = dark ? "表示を明るくする" : "表示を暗くする";
    themeBtn.setAttribute("aria-label", label);
    themeBtn.setAttribute("title", label);
    themeMenu.setAttribute("aria-label", label);
    themeMenu.querySelector(".pox-theme-label").textContent = label;
  }
  function toggleTheme(){
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("pox_theme", next); } catch (_) {}
    syncThemeBtn();
  }
  themeBtn.addEventListener("click", toggleTheme);
  themeMenu.addEventListener("click", toggleTheme);
  syncThemeBtn();

  // ── 現在ページの強調（常時表示リンクのみ）────────────────────────────
  var path = location.pathname;
  if (path === "/connect")     document.getElementById("navMatch").style.color = "var(--nav-text)";
  if (path === "/communities") document.getElementById("navCommunities").style.color = "var(--nav-text)";
})();
</script>
