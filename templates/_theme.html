{#- 色の名前（指示書75 §1・§3）。全ページの <head> で読み込む（_base.html と、_base を使わない login.html・index.html）。
    色はここ 1 か所だけで決める（明るい色は :root、暗い色は :root[data-theme="dark"]）。テンプレートは var(--…) で参照する。
    役割で名付ける（色の名前で付けない）。表示の選択は、その人のブラウザの中（localStorage "pox_theme"）だけに覚える。 -#}
<script>
/* 表示（明るい／暗い）をページを描く前に決める（ちらつきを出さない。指示書75 §4）。選んだものがあればそれ、無ければ端末の設定。
   サーバーには送らない・クッキーは使わない。 */
(function () {
  var t = null;
  try { t = localStorage.getItem("pox_theme"); } catch (e) { t = null; }
  if (t !== "dark" && t !== "light") {
    t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<style>
  :root{
    color-scheme: light;      /* 入力欄・ボタン・スクロールバーの既定の色（指示書75 §3） */
    /* ── 色の名前（指示書75 §1）: 役割で名付け、色はここ 1 か所だけで決める（テンプレートは var(--…) で参照する） ── */
    /* 地 */
    --bg: #ffffff;            /* ページの背景 */
    --surface: #ffffff;       /* カード・入力欄・メニューの背景 */
    --surface-2: #f6f7f9;     /* 一段下げた背景（淡い面） */
    --overlay: rgba(0,0,0,.4);/* 画面を覆う幕（ダイアログの後ろ） */
    --shadow: rgba(0,0,0,.18);/* 影 */
    /* 文字 */
    --text: #222222;          /* 本文・見出し */
    --text-sub: #555555;      /* 補助の文字 */
    --text-muted: #6e7279;    /* 薄い文字・押せない状態（地との比 4.5 以上） */
    --link: #1a3a5c;          /* リンク・紺の文字 */
    /* 線 */
    --line: #e6e8ec;          /* 区切り線・淡い枠 */
    --line-strong: #cfd3d9;   /* 入力欄・ボタンの枠 */
    --ring: #1f3a5f;          /* フォーカスリング1色（§6） */
    /* ナビ */
    --nav-bg: #1a3a5c;        /* ナビの帯 */
    --nav-text: #ffffff;      /* ナビの主な文字（ロゴ・いまのページ） */
    --nav-sub: #ccddee;       /* ナビのリンク・枠 */
    /* 強調 */
    --accent: #1a3a5c;        /* 主なボタンの背景・強い枠 */
    --accent-hover: #2a5a8c;  /* 主なボタンの押す前の強調 */
    --on-accent: #ffffff;     /* 色の付いたボタンの上の文字 */
    --mark-bg: #eef2ff;       /* 印（新しいやり取り・未読など）の背景 */
    --mark-text: #33417a;     /* 印の文字 */
    /* 状態 */
    --warn-text: #856404;     /* 注意の文字（と、注意のボタンの背景） */
    --warn-bg: #fff3cd;       /* 注意の背景 */
    --warn-line: #e6cf9c;     /* 注意の枠 */
    --error-text: #cc0000;    /* 誤りの文字 */
    --error-bg: #fbe9ea;      /* 誤りの背景 */
    --ok-text: #1a6a3a;       /* 成功の文字・関係のラベル・自分の発言の線 */
    --ok-bg: #e7f5ec;         /* 成功の背景 */
    /* 説明の画面（指示書74 追補2 の帯） */
    --band-rev: #e6eef7;      /* 受けた人の目的の側の帯 */
    --band-main: #f4ecdc;     /* 申請者の目的の側の帯 */
  }
  /* 暗い色の組（指示書75 §3）。地は真っ黒にしない・文字は真っ白にしない。ナビの紺を基調にする。影は薄く */
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg: #0f1722;
    --surface: #16212f;
    --surface-2: #1c2938;
    --overlay: rgba(0,0,0,.6);
    --shadow: rgba(0,0,0,.25);
    --text: #e6ebf2;
    --text-sub: #c3cbd6;
    --text-muted: #9aa5b4;
    --link: #9cc3ec;
    --line: #2a3a4d;
    --line-strong: #3e5168;
    --ring: #9cc3ec;
    --nav-bg: #13263d;
    --nav-text: #f1f4f8;
    --nav-sub: #b7cbe2;
    --accent: #8fb8e6;
    --accent-hover: #a8c8ee;
    --on-accent: #0c1724;
    --mark-bg: #24345a;
    --mark-text: #cdd7ff;
    --warn-text: #e6c36a;
    --warn-bg: #3a2f12;
    --warn-line: #6b5520;
    --error-text: #ff9a9a;
    --error-bg: #3d1a1d;
    --ok-text: #80d4a2;
    --ok-bg: #163428;
    --band-rev: #1d3350;
    --band-main: #3a2f1c;
  }
  html{ background: var(--bg); color: var(--text); }
</style>
