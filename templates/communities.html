<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>コミュニティ — PoX</title>
<style>
  body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  .community-card {
    border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 12px 0;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .community-card h3 { margin: 0 0 4px; font-size: 1rem; }
  .community-card p { margin: 0; font-size: 13px; color: #555; }
  .card-meta { font-size: 12px; color: #888; margin-top: 6px; }
  .btn { padding: 6px 16px; cursor: pointer; border: none; border-radius: 4px; font-size: 13px; }
  .btn-primary { background: #1a3a5c; color: white; }
  .btn-outline { background: white; color: #1a3a5c; border: 1px solid #1a3a5c; }
  /* モーダル */
  .modal-overlay { display:none; position:fixed; top:0;left:0;right:0;bottom:0;
                   background:rgba(0,0,0,0.4); z-index:100; align-items:center; justify-content:center; }
  .modal-overlay.open { display:flex; }
  .modal { background:white; border-radius:8px; padding:24px; width:400px; max-width:90vw; }
  .modal h2 { margin:0 0 16px; font-size:1.1rem; }
  label { display:block; font-size:13px; font-weight:bold; margin-top:12px; }
  input[type=text], textarea {
    width:100%; box-sizing:border-box; padding:6px 10px; font-size:13px;
    border:1px solid #ccc; border-radius:4px; margin-top:4px;
  }
  textarea { height:80px; }
  .modal-actions { margin-top:20px; display:flex; gap:8px; justify-content:flex-end; }
  #notice { font-size:13px; margin-top:6px; color:#c00; }
</style>
</head>
<body>
{% include "_nav.html" %}
<div style="display:flex;justify-content:space-between;align-items:center">
  <h1>コミュニティ</h1>
  <button class="btn btn-primary" onclick="openModal()">+ 新規作成</button>
</div>

<div id="list"><p style="color:#888">読み込み中...</p></div>
<div id="notice"></div>

<!-- 作成モーダル -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2>コミュニティを作成</h2>
    <label>名前</label>
    <input type="text" id="cName" placeholder="コミュニティ名">
    <label>説明</label>
    <textarea id="cDesc" placeholder="コミュニティの説明"></textarea>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="createCommunity()">作成</button>
    </div>
  </div>
</div>

<script>
const myId = localStorage.getItem("pox_my_id");

async function loadCommunities() {
  const res = await fetch("/api/communities");
  const data = await res.json();
  const el = document.getElementById("list");
  if (!data.length) {
    el.innerHTML = '<p style="color:#aaa">まだコミュニティはありません。最初に作成しましょう！</p>'; return;
  }
  el.innerHTML = data.map(c => {
    const href = `/community/${encodeURIComponent(c.id)}`;
    return `<div class="community-card">
      <div style="flex:1">
        <h3><a href="${href}" style="text-decoration:none;color:#1a3a5c">${escHtml(c.name)}</a></h3>
        <p>${escHtml(c.description || "")}</p>
        <div class="card-meta">メンバー: ${c.member_count}人 &nbsp; founder: ${escHtml(c.founder)}</div>
      </div>
      <div style="margin-left:16px;flex-shrink:0">
        <a href="${href}" class="btn btn-outline" style="text-decoration:none;display:inline-block">詳細</a>
      </div>
    </div>`;
  }).join("");
}

function openModal()  { document.getElementById("modal").classList.add("open"); }
function closeModal() { document.getElementById("modal").classList.remove("open"); }

async function createCommunity() {
  const name = document.getElementById("cName").value.trim();
  const desc = document.getElementById("cDesc").value.trim();
  const notice = document.getElementById("notice");
  if (!name) { notice.textContent = "名前を入力してください"; return; }
  if (!myId) { notice.textContent = "マイページでIDを設定してください"; return; }

  const res = await fetch("/api/communities", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, description: desc, founder_id: myId }),
  });
  const data = await res.json();
  if (!res.ok) { notice.textContent = "エラー: " + JSON.stringify(data); return; }

  closeModal();
  document.getElementById("cName").value = "";
  document.getElementById("cDesc").value = "";
  notice.textContent = "";
  location.href = `/community/${encodeURIComponent(data.id)}`;
}

function escHtml(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

loadCommunities();
</script>
</body>
</html>
