<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>会話 — PoX</title>
<style>
  body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.2rem; margin-bottom: 4px; }
  #chatBox {
    border: 1px solid #ddd; border-radius: 6px; height: 400px;
    overflow-y: auto; padding: 12px; background: #fafafa; margin: 16px 0;
  }
  .bubble { max-width: 70%; margin: 6px 0; padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.5; }
  .bubble.mine { background: #1a3a5c; color: white; margin-left: auto; border-bottom-right-radius: 4px; }
  .bubble.theirs { background: #e8e8e8; color: #222; border-bottom-left-radius: 4px; }
  .bubble .meta { font-size: 10px; opacity: 0.7; margin-top: 2px; }
  .input-row { display: flex; gap: 8px; }
  .input-row textarea {
    flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px;
    font-size: 13px; resize: none; height: 60px;
  }
  .input-row button {
    padding: 8px 20px; background: #1a3a5c; color: white;
    border: none; border-radius: 4px; cursor: pointer; align-self: flex-end;
  }
  #notice { font-size: 13px; margin-top: 6px; color: #c00; }
</style>
</head>
<body>
{% include "_nav.html" %}
<a href="javascript:history.back()" style="font-size:13px;color:#555;text-decoration:none">← 戻る</a>
<h1>会話: <span id="withName"></span></h1>
<p style="font-size:12px;color:#888;margin:0">あなた: <code id="myName"></code></p>

<div id="chatBox"></div>

<div>
  <div id="attachPreview" style="display:none;margin-bottom:8px;padding:8px;background:#f0f4ff;border-radius:6px;font-size:12px;align-items:center;gap:8px">
    <span id="attachName" style="flex:1"></span>
    <button onclick="clearAttach()" style="border:none;background:none;cursor:pointer;color:#c00;font-size:16px">✕</button>
  </div>
  <div class="input-row">
    <label for="fileInput" style="cursor:pointer;padding:8px 12px;background:#f0f0f0;border:1px solid #ccc;border-radius:4px;display:flex;align-items:center;font-size:18px;white-space:nowrap" title="ファイルを添付">📎</label>
    <input type="file" id="fileInput" style="display:none" accept="image/*,.pdf,.txt,.csv,.zip" onchange="handleFile(event)">
    <textarea id="msgInput" placeholder="メッセージを入力... (Shift+Enterで改行)" onkeydown="handleKey(event)"></textarea>
    <button onclick="sendMsg()">送信</button>
  </div>
</div>
<div id="notice"></div>

<script>
const params = new URLSearchParams(location.search);
const myId    = params.get("me");
const otherId = params.get("with");

document.getElementById("myName").textContent   = myId || "";
document.getElementById("withName").textContent = otherId || "";

if (!myId || !otherId) {
  document.getElementById("notice").textContent = "URL に me= と with= が必要です。";
}

async function loadConversation() {
  if (!myId || !otherId) return;
  const res = await fetch(`/api/conversation?me=${encodeURIComponent(myId)}&with=${encodeURIComponent(otherId)}`);
  if (!res.ok) return;
  const msgs = await res.json();

  const box = document.getElementById("chatBox");
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;

  box.innerHTML = msgs.map(m => {
    const isMine = m.from_id === myId;
    const time = (m.created_at || "").slice(11, 16);
    return `<div style="display:flex;justify-content:${isMine ? "flex-end" : "flex-start"}">
      <div class="bubble ${isMine ? "mine" : "theirs"}">
        ${m.body ? escHtml(m.body) : ""}
        ${renderAttachment(m.attachment_url)}
        <div class="meta">${isMine ? "あなた" : escHtml(m.from_id)} ${time}</div>
      </div>
    </div>`;
  }).join("") || '<p style="color:#aaa;text-align:center;margin-top:40px">まだメッセージがありません</p>';

  if (atBottom || msgs.length === 0) {
    box.scrollTop = box.scrollHeight;
  }
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMsg(); }
}

async function sendMsg() {
  const input = document.getElementById("msgInput");
  const body = input.value.trim();
  if (!body && !pendingAttachUrl) return;
  if (!myId || !otherId) return;

  input.value = "";
  const payload = { from_id: myId, to_id: otherId, body: body || "" };
  if (pendingAttachUrl) { payload.attachment_url = pendingAttachUrl; clearAttach(); }

  const res = await fetch("/messages", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  if (!res.ok) {
    const data = await res.json();
    document.getElementById("notice").textContent = "エラー: " + JSON.stringify(data);
    return;
  }
  await loadConversation();
  const box = document.getElementById("chatBox");
  box.scrollTop = box.scrollHeight;
}

/* ── 添付ファイル ── */
let pendingAttachUrl = null;

async function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append("file", file);
  const res = await fetch("/api/upload", { method: "POST", body: fd });
  if (!res.ok) { alert("アップロード失敗"); return; }
  const data = await res.json();
  pendingAttachUrl = data.url;
  const prev = document.getElementById("attachPreview");
  prev.style.display = "flex";
  document.getElementById("attachName").textContent = "📎 " + file.name;
}

function clearAttach() {
  pendingAttachUrl = null;
  document.getElementById("attachPreview").style.display = "none";
  document.getElementById("fileInput").value = "";
}

function renderAttachment(url) {
  if (!url) return "";
  const ext = url.split(".").pop().toLowerCase();
  if (["jpg","jpeg","png","gif","webp"].includes(ext)) {
    return `<img src="${escHtml(url)}" style="max-width:220px;max-height:180px;border-radius:6px;display:block;margin-top:6px">`;
  }
  const fname = url.split("/").pop();
  return `<a href="${escHtml(url)}" download style="display:block;margin-top:6px;font-size:12px;color:#adf">📎 ${escHtml(fname)}</a>`;
}

function escHtml(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

loadConversation();
setInterval(loadConversation, 5000);
</script>
</body>
</html>
