<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>プロフィール編集 — PoX</title>
<style>
  body { font-family: sans-serif; max-width: 820px; margin: 40px auto; padding: 0 16px; color: #222; }
  a.back { font-size: 13px; color: #555; text-decoration: none; }
  h1 { font-size: 1.3rem; margin: 12px 0 4px; }
  .sub { font-size: 13px; color: #555; margin: 2px 0 16px; }

  .tabs { display: flex; gap: 4px; border-bottom: 2px solid #e0e0e0; margin-top: 20px; }
  .tab { padding: 9px 18px; cursor: pointer; font-size: 14px; color: #666; border: none; background: none;
         border-bottom: 2px solid transparent; margin-bottom: -2px; }
  .tab.active { color: #1a3a5c; font-weight: bold; border-bottom-color: #1a3a5c; }
  .panel { display: none; padding: 20px 0; }
  .panel.active { display: block; }

  label { display: block; margin-top: 16px; font-weight: bold; font-size: 13px; }
  label .hint { font-weight: normal; color: #888; margin-left: 6px; }
  textarea, input[type=text] {
    width: 100%; box-sizing: border-box; padding: 7px 10px; font-size: 13px;
    border: 1px solid #ccc; border-radius: 4px; margin-top: 5px;
  }
  textarea { height: 80px; resize: vertical; line-height: 1.6; }
  textarea.tall { height: 120px; }

  .section-header {
    font-size: 12px; font-weight: bold; color: #1a3a5c;
    text-transform: uppercase; letter-spacing: .05em;
    border-bottom: 1px solid #e8eef8; padding-bottom: 4px;
    margin-top: 28px; margin-bottom: 2px;
  }
  .slot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }

  .btn { padding: 8px 24px; cursor: pointer; background: #1a3a5c; color: white;
         border: none; border-radius: 4px; font-size: 14px; margin-top: 22px; }
  .btn-ghost { background: #f0f0f0; border: 1px solid #ccc; color: #333; }
  .notice { margin-top: 10px; font-size: 13px; min-height: 1.2em; }
  .ok  { color: #1a8a1a; font-weight: bold; }
  .err { color: #c00; }
  #loading { color: #888; margin-top: 40px; }

  .reorder-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid #e0e0e0;
                  border-radius: 5px; margin-bottom: 6px; background: #fafafa; font-size: 13px; }
  .reorder-item.hidden-row { opacity: .45; background: #f3f3f3; }
  .reorder-item .txt { flex: 1; line-height: 1.5; }
  .reorder-item .arrow { background: #fff; border: 1px solid #ccc; border-radius: 4px; width: 26px; height: 24px;
                         cursor: pointer; font-size: 12px; line-height: 1; }
  .reorder-item .arrow:disabled { opacity: .3; cursor: default; }
  .traj-mini-from { color:#444; } .traj-mini-arrow { color:#aaa; margin:0 4px; } .traj-mini-to { color:#1a5c1a; }

  .ai-box { background:#f0f4ff; border-left:4px solid #1a3a5c; padding:12px 16px; border-radius:0 6px 6px 0;
            margin-top:14px; font-size:13px; line-height:1.7; }
  .ai-box a { color:#1a3a5c; }

  @media (max-width: 600px) { .slot-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
{% include "_nav.html" %}
<a href="/" class="back">← トップに戻る</a>
<h1>プロフィール編集</h1>
<div id="loading">読み込み中...</div>

<div id="wrap" style="display:none">
  <p class="sub">ID: <code id="editId"></code></p>

  <div class="tabs">
    <button class="tab active" data-tab="core" onclick="switchTab('core')">中身を編集</button>
    <button class="tab" data-tab="view" onclick="switchTab('view')">見せ方を編集</button>
  </div>

  <!-- 中身を編集（二軸・v4） -->
  <div class="panel active" id="panel-core">
    <p class="sub">マッチングの判断に使われる「意志」と「現状」です。保存すると表示も再生成されます。</p>

    <div class="section-header">意志 — なぜ動くか・どこへ</div>
    <label>意志 <span class="hint">— 根底の価値（抽象）と、いまの願い（具体）の両方</span></label>
    <textarea id="f_will" class="tall"></textarea>

    <div class="section-header">現状 — いま何を持ち、どう動けるか、何が止めているか</div>
    <div class="slot-grid">
      <div>
        <label>持っているもの <span class="hint">— 資源・関係・実績</span></label>
        <textarea id="f_state_have"></textarea>
      </div>
      <div>
        <label>できること（型） <span class="hint">— 複数エピソードの共通点から抽出した動き方</span></label>
        <textarea id="f_state_can"></textarea>
      </div>
      <div>
        <label>縛られているもの <span class="hint">— いまを止めている制約・環境</span></label>
        <textarea id="f_state_bound"></textarea>
      </div>
      <div>
        <label>未分類 <span class="hint">— どのスロットにも割り切れなかった原文（任意）</span></label>
        <textarea id="f_state_unsorted"></textarea>
      </div>
    </div>

    <br>
    <button class="btn" onclick="saveCore()">中身を保存する</button>
    <div class="notice" id="coreNotice"></div>

    <div class="ai-box">
      <strong>もっと充実させたいときは ──</strong><br>
      登録ページの「AIと対話して作る」プロンプトを使い、生成された JSON を貼り直すとこのアカウントに上書き反映されます。<br>
      <a href="/register">→ 登録ページでAIに作り直してもらう</a>
    </div>
  </div>

  <!-- 見せ方を編集 -->
  <div class="panel" id="panel-view">
    <p class="sub">表示の文言・並び順・公開ON/OFFだけを変えます。マッチングの中身（上のタブ）は変わりません。</p>

    <label>見出し（headline） <span class="hint">— 空欄なら要約文を使います</span></label>
    <input type="text" id="f_headline">

    <label style="margin-top:24px">注目ポイント <span class="hint">— チェックで公開／↑↓で並び替え</span></label>
    <div id="keysList"></div>

    <label style="margin-top:24px">軌跡 <span class="hint">— チェックで公開／↑↓で並び替え</span></label>
    <div id="trajList"></div>

    <br>
    <button class="btn" onclick="saveOverrides()">見せ方を保存する</button>
    <div class="notice" id="viewNotice"></div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const myId = params.get("id") || localStorage.getItem("pox_my_id");

let baseKeys = [];
let baseTraj = [];

if (!myId) {
  document.getElementById("loading").innerHTML =
    '<span style="color:#c00">URL に ?id= が指定されていません。</span>';
}

function switchTab(name) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === name));
  document.getElementById("panel-core").classList.toggle("active", name === "core");
  document.getElementById("panel-view").classList.toggle("active", name === "view");
}

async function init() {
  if (!myId) return;
  const res = await fetch(`/api/profile/${encodeURIComponent(myId)}/edit`);
  if (!res.ok) {
    document.getElementById("loading").innerHTML =
      `<span style="color:#c00">プロフィール "${myId}" が見つかりません。</span>`;
    return;
  }
  const { base, overrides } = await res.json();

  document.getElementById("loading").style.display = "none";
  document.getElementById("wrap").style.display = "block";
  document.getElementById("editId").textContent = myId;

  // 意志は共通
  document.getElementById("f_will").value = base.pursuing || "";

  if (base.schema_version === "v4") {
    document.getElementById("f_state_have").value    = base.state_have    || "";
    document.getElementById("f_state_can").value     = base.state_can_type || "";
    document.getElementById("f_state_bound").value   = base.state_bound   || "";
    document.getElementById("f_state_unsorted").value = base.state_unsorted || "";
  } else {
    // v3 → v4 フォームへ引き当て
    document.getElementById("f_state_can").value   = base.offering || "";
    document.getElementById("f_state_bound").value = (base.phase_badge && base.phase_badge.value) || "";
  }

  document.getElementById("f_headline").value = overrides.headline || "";
  buildKeysState(base.keys || [], overrides.keys);
  buildTrajState(base.trajectory || [], overrides.trajectory);
  renderKeys();
  renderTraj();
}

function buildKeysState(allKeys, ovKeys) {
  if (Array.isArray(ovKeys)) {
    const visible = ovKeys.filter(k => allKeys.includes(k));
    const hidden  = allKeys.filter(k => !ovKeys.includes(k));
    baseKeys = [
      ...visible.map(text => ({ text, visible: true })),
      ...hidden.map(text => ({ text, visible: false })),
    ];
  } else {
    baseKeys = allKeys.map(text => ({ text, visible: true }));
  }
}

function buildTrajState(allTraj, ovTraj) {
  const sig = t => `${t.from}|||${t.to}`;
  const bySig = {}; allTraj.forEach(t => bySig[sig(t)] = t);
  if (Array.isArray(ovTraj)) {
    const visibleSigs = ovTraj.filter(s => bySig[s]);
    const hidden = allTraj.filter(t => !ovTraj.includes(sig(t)));
    baseTraj = [
      ...visibleSigs.map(s => ({ ...bySig[s], sig: s, visible: true })),
      ...hidden.map(t => ({ ...t, sig: sig(t), visible: false })),
    ];
  } else {
    baseTraj = allTraj.map(t => ({ ...t, sig: sig(t), visible: true }));
  }
}

function renderKeys() {
  const c = document.getElementById("keysList");
  if (!baseKeys.length) { c.innerHTML = '<p style="font-size:12px;color:#999">注目ポイントはまだありません。</p>'; return; }
  c.innerHTML = baseKeys.map((k, i) => `
    <div class="reorder-item ${k.visible ? "" : "hidden-row"}">
      <input type="checkbox" ${k.visible ? "checked" : ""} onchange="toggleKey(${i})">
      <span class="txt">${escHtml(k.text)}</span>
      <button class="arrow" onclick="moveKey(${i},-1)" ${i === 0 ? "disabled" : ""}>↑</button>
      <button class="arrow" onclick="moveKey(${i},1)" ${i === baseKeys.length - 1 ? "disabled" : ""}>↓</button>
    </div>`).join("");
}

function renderTraj() {
  const c = document.getElementById("trajList");
  if (!baseTraj.length) { c.innerHTML = '<p style="font-size:12px;color:#999">軌跡はまだありません。</p>'; return; }
  c.innerHTML = baseTraj.map((t, i) => `
    <div class="reorder-item ${t.visible ? "" : "hidden-row"}">
      <input type="checkbox" ${t.visible ? "checked" : ""} onchange="toggleTraj(${i})">
      <span class="txt"><span class="traj-mini-from">${escHtml(t.from)}</span><span class="traj-mini-arrow">→</span><span class="traj-mini-to">${escHtml(t.to)}</span></span>
      <button class="arrow" onclick="moveTraj(${i},-1)" ${i === 0 ? "disabled" : ""}>↑</button>
      <button class="arrow" onclick="moveTraj(${i},1)" ${i === baseTraj.length - 1 ? "disabled" : ""}>↓</button>
    </div>`).join("");
}

function toggleKey(i)  { baseKeys[i].visible = !baseKeys[i].visible; renderKeys(); }
function toggleTraj(i) { baseTraj[i].visible = !baseTraj[i].visible; renderTraj(); }
function moveKey(i, d)  { swap(baseKeys, i, i + d); renderKeys(); }
function moveTraj(i, d) { swap(baseTraj, i, i + d); renderTraj(); }
function swap(arr, i, j) {
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
}

async function saveCore() {
  const notice = document.getElementById("coreNotice");
  notice.className = ""; notice.textContent = "保存中...";
  const body = {
    "意志":        document.getElementById("f_will").value,
    "state_have":     document.getElementById("f_state_have").value,
    "state_can_type": document.getElementById("f_state_can").value,
    "state_bound":    document.getElementById("f_state_bound").value,
    "state_unsorted": document.getElementById("f_state_unsorted").value,
  };
  const res = await fetch(`/api/profile/${encodeURIComponent(myId)}/core`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (res.ok) {
    notice.className = "ok"; notice.textContent = "✅ 保存しました";
    setTimeout(() => notice.textContent = "", 3000);
  } else {
    notice.className = "err"; notice.textContent = "エラー: " + (data.error || JSON.stringify(data));
  }
}

async function saveOverrides() {
  const notice = document.getElementById("viewNotice");
  notice.className = ""; notice.textContent = "保存中...";
  const overrides = {
    headline: document.getElementById("f_headline").value.trim(),
    keys: baseKeys.filter(k => k.visible).map(k => k.text),
    trajectory: baseTraj.filter(t => t.visible).map(t => t.sig),
  };
  const res = await fetch(`/api/profile/${encodeURIComponent(myId)}/overrides`, {
    method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ overrides }),
  });
  const data = await res.json();
  if (res.ok) {
    notice.className = "ok"; notice.textContent = "✅ 見せ方を保存しました";
    setTimeout(() => notice.textContent = "", 3000);
  } else {
    notice.className = "err"; notice.textContent = "エラー: " + (data.error || JSON.stringify(data));
  }
}

function escHtml(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

init();
</script>
</body>
</html>
