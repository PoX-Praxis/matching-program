<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>プロフィール編集 — PoX</title>
<style>
  body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  h2 { font-size: 1.05rem; border-bottom: 1px solid #ddd; padding-bottom: 4px; margin-top: 32px; }
  label { display: block; margin-top: 16px; font-weight: bold; font-size: 13px; }
  input[type=text], textarea, select {
    width: 100%; box-sizing: border-box; padding: 6px 10px; font-size: 13px;
    border: 1px solid #ccc; border-radius: 4px; margin-top: 4px;
  }
  textarea { height: 100px; font-family: monospace; }
  textarea#otherJson { height: 180px; }
  button { padding: 8px 24px; cursor: pointer; background: #1a3a5c; color: white;
           border: none; border-radius: 4px; font-size: 14px; margin-top: 20px; }
  #notice { margin-top: 8px; font-size: 13px; }
  .ok  { color: #1a8a1a; font-weight: bold; }
  .err { color: #c00; }
  #loading { color: #888; margin-top: 40px; }
</style>
</head>
<body>
{% include "_nav.html" %}
<a href="/" style="font-size:13px;color:#555;text-decoration:none">← トップに戻る</a>
<h1>プロフィール編集</h1>
<div id="loading">読み込み中...</div>
<div id="form" style="display:none">
  <p style="font-size:13px;color:#555">ID: <code id="editId"></code></p>

  <h2>主要フィールド</h2>

  <label style="display:block;margin-top:16px;font-weight:bold;font-size:13px">意志 <span style="font-weight:normal;color:#888">— なぜ動くのか、何を実現したいのか</span></label>
  <textarea id="f_will" style="width:100%;box-sizing:border-box;padding:6px 10px;border:1px solid #ccc;border-radius:4px;font-size:13px;height:80px;resize:vertical;margin-top:4px" placeholder="止まっているものを接続で動かし直したい"></textarea>

  <label style="display:block;margin-top:16px;font-weight:bold;font-size:13px">求めている <span style="font-weight:normal;color:#888">— どんな人・スキル・関係性が欲しいか</span></label>
  <textarea id="f_want" style="width:100%;box-sizing:border-box;padding:6px 10px;border:1px solid #ccc;border-radius:4px;font-size:13px;height:80px;resize:vertical;margin-top:4px"></textarea>

  <label style="display:block;margin-top:16px;font-weight:bold;font-size:13px">能力 <span style="font-weight:normal;color:#888">— 今あなたが提供できるもの・強み</span></label>
  <textarea id="f_ability" style="width:100%;box-sizing:border-box;padding:6px 10px;border:1px solid #ccc;border-radius:4px;font-size:13px;height:80px;resize:vertical;margin-top:4px"></textarea>

  <label style="display:block;margin-top:16px;font-weight:bold;font-size:13px">フェーズ <span style="font-weight:normal;color:#888">— 現在のステージ</span></label>
  <input id="f_phase" list="phaseList" style="width:100%;box-sizing:border-box;padding:6px 10px;border:1px solid #ccc;border-radius:4px;font-size:13px;margin-top:4px" placeholder="mvp">
  <datalist id="phaseList">
    <option value="idea">
    <option value="mvp">
    <option value="early_validation">
    <option value="growth">
    <option value="scale">
    <option value="fundraising">
    <option value="事業化前">
    <option value="検証中">
    <option value="運用中">
  </datalist>

  <h2>その他の情報</h2>
  <p style="font-size:12px;color:#666;margin:4px 0 10px">追加したい項目があれば自由に入力してください（例: リンク、所在地、得意分野 など）。</p>
  <div id="extraRows"></div>
  <button type="button" onclick="addExtraRow()" style="padding:4px 14px;font-size:12px;cursor:pointer;background:#f0f0f0;border:1px solid #ccc;border-radius:4px;margin-top:8px">+ 項目を追加</button>

  <br><br>
  <button onclick="save()" style="padding:8px 24px;cursor:pointer;background:#1a3a5c;color:white;border:none;border-radius:4px;font-size:14px">保存する</button>
  <div id="notice" style="margin-top:8px;font-size:13px"></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const myId = params.get("id");
const MAIN_KEYS = ["意志", "求めている", "能力", "フェーズ"];

if (!myId) {
  document.getElementById("loading").innerHTML =
    '<span style="color:#c00">URL に ?id= が指定されていません。</span>';
}

async function init() {
  if (!myId) return;
  const res = await fetch(`/seekers/${encodeURIComponent(myId)}`);
  if (!res.ok) {
    document.getElementById("loading").innerHTML =
      `<span style="color:#c00">seeker "${myId}" が見つかりません。</span>`;
    return;
  }
  const { seeker } = await res.json();

  document.getElementById("loading").style.display = "none";
  document.getElementById("form").style.display = "block";
  document.getElementById("editId").textContent = myId;

  document.getElementById("f_will").value    = seeker["意志"] || "";
  document.getElementById("f_want").value    = seeker["求めている"] || "";
  document.getElementById("f_ability").value = seeker["能力"] || "";
  document.getElementById("f_phase").value   = seeker["フェーズ"] || "";

  const container = document.getElementById("extraRows");
  container.innerHTML = "";
  for (const [k, v] of Object.entries(seeker)) {
    if (MAIN_KEYS.includes(k)) continue;
    const val = typeof v === "string" ? v : JSON.stringify(v);
    addExtraRow(k, val);
  }
}

function addExtraRow(key, value) {
  const container = document.getElementById("extraRows");
  const row = document.createElement("div");
  row.style.cssText = "display:flex;gap:8px;margin-bottom:8px;align-items:center";
  row.innerHTML = `
    <input type="text" placeholder="項目名" value="${escAttr(key || "")}"
      style="width:140px;padding:6px 10px;border:1px solid #ccc;border-radius:4px;font-size:13px;flex-shrink:0">
    <input type="text" placeholder="値" value="${escAttr(value || "")}"
      style="flex:1;padding:6px 10px;border:1px solid #ccc;border-radius:4px;font-size:13px">
    <button type="button" onclick="this.parentElement.remove()"
      style="padding:4px 10px;background:none;border:1px solid #ddd;border-radius:4px;cursor:pointer;color:#c00;font-size:14px">✕</button>
  `;
  container.appendChild(row);
}

async function save() {
  const notice = document.getElementById("notice");
  notice.textContent = "";

  const body = {
    id: myId,
    "意志": document.getElementById("f_will").value,
    "求めている": document.getElementById("f_want").value,
    "能力": document.getElementById("f_ability").value,
    "フェーズ": document.getElementById("f_phase").value,
  };

  const rows = document.getElementById("extraRows").querySelectorAll("div");
  for (const row of rows) {
    const inputs = row.querySelectorAll("input");
    const k = inputs[0].value.trim();
    const v = inputs[1].value.trim();
    if (k) body[k] = v;
  }

  const res = await fetch("/seekers", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (res.ok) {
    notice.className = "ok"; notice.textContent = "✅ 保存しました！";
    setTimeout(() => notice.textContent = "", 3000);
  } else {
    notice.className = "err"; notice.textContent = "エラー: " + JSON.stringify(data);
  }
}

function escAttr(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

init();
</script>
</body>
</html>
