<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PoX マッチング</title>
<style>
  body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1  { font-size: 1.4rem; margin-bottom: 16px; }
  h2  { font-size: 1.05rem; border-bottom: 1px solid #ddd; padding-bottom: 4px; margin-top: 36px; }
  textarea { width: 100%; height: 180px; font-family: monospace; font-size: 12px; box-sizing: border-box; }
  button    { padding: 6px 18px; cursor: pointer; margin-top: 6px; }
  button.sm { padding: 3px 10px; font-size: 12px; margin: 0; }
  table { border-collapse: collapse; width: 100%; margin-top: 10px; font-size: 13px; }
  th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; vertical-align: top; }
  th { background: #f5f5f5; white-space: nowrap; }
  td.center { text-align: center; }
  .reason { font-size: 11px; color: #555; }
  .ok  { color: #1a8a1a; font-weight: bold; }
  .err { color: #c00; }
  #myIdBar { background: #eef2ff; padding: 10px 14px; border-radius: 6px; margin-bottom: 20px; font-size: 13px; }
  .badge-ok   { background: #d4edda; color: #155724; border-radius: 3px; padding: 2px 8px; font-size: 11px; }
  .badge-wait { background: #fff3cd; color: #856404; border-radius: 3px; padding: 2px 8px; font-size: 11px; }
  #postMsg, #approveMsg { min-height: 1.2em; margin-top: 6px; }
</style>
</head>
<body>
{% include "_nav.html" %}
<h1>PoX マッチング プロトタイプ</h1>

<!-- ── あなたのID（ログイン代わり） ── -->
<div id="myIdBar">
  <strong>あなたの seeker ID:</strong>
  <select id="myId" onchange="saveMyId()">
    <option value="">-- 選択してください --</option>
  </select>
  <button onclick="openMyPage()" style="margin-left:10px;padding:4px 14px;font-size:13px">マイページ →</button>
  <span style="color:#888;margin-left:10px;font-size:12px">（承認ボタンを使う前に選択してください）</span>
</div>

<!-- ── 1. 投稿 ── -->
<h2>1. seeker を登録</h2>
<p style="margin:4px 0 6px;font-size:13px;">v3 が出力した JSON をそのまま貼り付けて送信（<code>id</code> は省略可）</p>
<textarea id="seekerJson" placeholder='{
  "id": "user_alice",
  "意志": "止まっているものを接続で動かし直したい",
  "求めている": "最初に試してくれる実証パートナー",
  "能力": "抽象概念を運用可能な構造へ落とす設計",
  "フェーズ": "mvp"
}'></textarea><br>
<button onclick="postSeeker()">登録</button>
<div id="postMsg"></div>

<!-- ── 2. 一覧 ── -->
<h2>2. 登録済み seeker 一覧</h2>
<button onclick="loadSeekers()">一覧を更新</button>
<table>
  <thead><tr><th>id</th><th>意志（抜粋）</th><th>フェーズ</th><th>マッチング</th></tr></thead>
  <tbody id="seekerRows"><tr><td colspan="4">読み込み中...</td></tr></tbody>
</table>

<!-- ── 3. マッチング結果 ── -->
<h2>3. マッチング結果</h2>
<div id="matchResult" style="color:#888;font-size:13px;">（一覧から「マッチング実行」を押すと表示されます）</div>
<div id="approveMsg"></div>

<!-- ── 4. 台帳 ── -->
<h2>4. 台帳（接続成否ログ）</h2>
<button onclick="loadLedger()">台帳を更新</button>
<table>
  <thead>
    <tr><th>vessel</th><th>創設者</th><th>参加者</th><th>承認状況</th><th>接続成立</th></tr>
  </thead>
  <tbody id="ledgerRows"><tr><td colspan="5">まだ記録がありません</td></tr></tbody>
</table>

<script>
let lastMatch = null;

/* ── あなたのID ── */
function saveMyId() {
  localStorage.setItem("pox_my_id", document.getElementById("myId").value);
}
function getMyId() {
  return document.getElementById("myId").value;
}
function openMyPage() {
  const id = getMyId();
  if (!id) { alert("先に「あなたの seeker ID」を選択してください"); return; }
  window.open(`/mypage?id=${encodeURIComponent(id)}`, "_blank");
}

/* ── JSON 書式清掃: // と /* * / コメント・末尾カンマを除去（文字列内は保護） ── */
function stripJsonComments(text) {
  let out = "", inStr = false, i = 0;
  while (i < text.length) {
    const c = text[i], n = text[i + 1];
    if (inStr) {
      out += c;
      if (c === "\\") { out += (n ?? ""); i += 2; continue; }  // エスケープはそのまま
      if (c === '"') inStr = false;
      i++; continue;
    }
    if (c === '"') { inStr = true; out += c; i++; continue; }
    if (c === "/" && n === "/") { while (i < text.length && text[i] !== "\n") i++; continue; }
    if (c === "/" && n === "*") { i += 2; while (i < text.length && !(text[i] === "*" && text[i + 1] === "/")) i++; i += 2; continue; }
    out += c; i++;
  }
  return out.replace(/,(\s*[}\]])/g, "$1");  // 末尾カンマ除去
}

/* ── 投稿 ── */
async function postSeeker() {
  const el = document.getElementById("postMsg");
  el.className = ""; el.textContent = "";
  let body;
  try { body = JSON.parse(stripJsonComments(document.getElementById("seekerJson").value)); }
  catch (e) { el.className = "err"; el.textContent = "JSON パース失敗: " + e.message; return; }
  const res = await fetch("/seekers", {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body),
  });
  const data = await res.json();
  if (res.ok) {
    el.className = "ok"; el.textContent = "✅ 登録完了  id: " + data.id;
    loadSeekers();
  } else {
    el.className = "err"; el.textContent = "エラー: " + JSON.stringify(data);
  }
}

/* ── 一覧 ── */
async function loadSeekers() {
  const res  = await fetch("/seekers");
  const rows = await res.json();

  // myId セレクタを更新（選択を保持）
  const saved = localStorage.getItem("pox_my_id") || "";
  const sel = document.getElementById("myId");
  sel.innerHTML = '<option value="">-- 選択してください --</option>'
    + rows.map(r => `<option value="${r.id}"${r.id === saved ? " selected" : ""}>${r.id}</option>`).join("");

  const tbody = document.getElementById("seekerRows");
  if (!rows.length) {
    tbody.innerHTML = "<tr><td colspan='4'>まだ seeker が登録されていません</td></tr>";
    return;
  }
  tbody.innerHTML = rows.map(r => {
    const will  = (r.seeker["意志"] || "").slice(0, 40) + ((r.seeker["意志"] || "").length > 40 ? "…" : "");
    const phase = r.seeker["フェーズ"] || "-";
    const sid   = r.id.replace(/'/g, "\\'");
    return `<tr>
      <td><a href="/profile/${encodeURIComponent(r.id)}" style="font-family:monospace;font-size:13px">${r.id}</a></td>
      <td>${will}</td>
      <td>${phase}</td>
      <td>
        <select id="want_${r.id}">
          <option value="complement">相補</option>
          <option value="similar">類似</option>
          <option value="balanced">バランス</option>
        </select>
        <button class="sm" onclick="runMatch('${sid}')">マッチング実行</button>
      </td>
    </tr>`;
  }).join("");
}

/* ── マッチング ── */
async function runMatch(seekerId) {
  const el   = document.getElementById("matchResult");
  const want = document.getElementById("want_" + seekerId).value;
  document.getElementById("approveMsg").textContent = "";
  el.innerHTML = "<span style='color:#888'>計算中...</span>";

  const res  = await fetch("/match", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ seeker_id: seekerId, want }),
  });
  const data = await res.json();

  if (!res.ok) {
    el.innerHTML = `<span class="err">エラー: ${data.error || JSON.stringify(data)}</span>`;
    return;
  }
  lastMatch = data;

  const needed = (data.needed_roles || []).map(r => `「${r.role}」`).join("、");
  const rankRows = data.ranking.map(r => {
    const cid = r.id.replace(/'/g, "\\'");
    const via = (r.comp_via || "").replace(/'/g, "\\'");
    const myId = getMyId();
    const dmBtn = myId
      ? `<button class="sm" onclick="location.href='/conversation?me=${encodeURIComponent(myId)}&with=${encodeURIComponent(r.id)}'" style="margin-left:4px">DM</button>`
      : "";
    return `<tr>
      <td class="center">${r.rank}</td>
      <td><a href="/profile/${encodeURIComponent(r.id)}" style="font-family:monospace;font-size:13px">${r.id}</a></td>
      <td class="center">${r.score}</td>
      <td class="center">${r.comp}</td>
      <td class="center">${r.sim}</td>
      <td class="reason">${r.reason}</td>
      <td class="center">
        <button class="sm" onclick="runApprove('${cid}','${via}')">承認する</button>${dmBtn}
      </td>
    </tr>`;
  }).join("");

  const demoBanner = data.demo_mode
    ? `<div style="background:#fff3cd;color:#856404;padding:6px 10px;border-radius:4px;font-size:12px;margin:6px 0">
         ⚠️ デモモード（ANTHROPIC_API_KEY 未設定）。スコアは固定ロジックの仮値です。実LLM判定にはキーを設定してください。
       </div>` : "";

  el.innerHTML = demoBanner + `
    <p style="font-size:13px;margin:4px 0">
      <strong>seeker:</strong> ${seekerId} &nbsp;
      <strong>want:</strong> ${data.want} &nbsp;
      <strong>必要像:</strong> ${needed || "-"}
    </p>`+ `
    <table>
      <thead>
        <tr><th>順</th><th>候補 id</th><th>総合</th><th>相補</th><th>類似</th><th>根拠</th><th>承認</th></tr>
      </thead>
      <tbody>${rankRows}</tbody>
    </table>`;
}

/* ── 承認 ── */
async function runApprove(candidateId, predictedRole) {
  const myId = getMyId();
  const msg  = document.getElementById("approveMsg");
  msg.className = ""; msg.textContent = "";

  if (!myId) {
    msg.className = "err"; msg.textContent = "⚠️ 先に「あなたの seeker ID」を選択してください";
    return;
  }
  if (myId === candidateId) {
    msg.className = "err"; msg.textContent = "⚠️ 自分自身は承認できません";
    return;
  }

  const res = await fetch("/approve", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      from_id: myId,
      to_id: candidateId,
      match_run_id: lastMatch?.match_run_id || null,
      predicted_role: predictedRole || null,
    }),
  });
  const data = await res.json();

  if (!res.ok) {
    msg.className = "err"; msg.textContent = "エラー: " + JSON.stringify(data);
    return;
  }
  if (data.established) {
    msg.className = "ok";
    msg.textContent = `🎉 接続成立！  vessel: ${data.vessel_id}`;
  } else {
    msg.className = "";
    msg.textContent = `✅ 承認を記録しました（vessel: ${data.vessel_id}）。相手の承認待ちです。`;
  }
  loadLedger();
}

/* ── 台帳 ── */
async function loadLedger() {
  const res  = await fetch("/ledger");
  const data = await res.json();
  const tbody = document.getElementById("ledgerRows");

  if (!data.length) {
    tbody.innerHTML = "<tr><td colspan='5'>まだ記録がありません</td></tr>";
    return;
  }
  tbody.innerHTML = data.map(v => {
    const j        = (v.joins || [])[0] || {};
    const founder  = v.founder;
    const joiner   = j.joiner || "-";
    const approvers = new Set((j.approvals || []).map(a => a.from));
    const statusParts = [
      `${founder}: ${approvers.has(founder) ? "✅" : "⏳"}`,
      `${joiner}: ${approvers.has(joiner)  ? "✅" : "⏳"}`,
    ].join("  ");
    const badge = v.is_connected
      ? `<span class="badge-ok">✅ 接続成立 ${(j.established_at || "").slice(0, 10)}</span>`
      : `<span class="badge-wait">⏳ 片側のみ</span>`;
    return `<tr>
      <td><code style="font-size:11px">${v.vessel_id}</code></td>
      <td>${founder}</td>
      <td>${joiner}</td>
      <td style="font-size:12px">${statusParts}</td>
      <td>${badge}</td>
    </tr>`;
  }).join("");
}

/* 初回ロード */
loadSeekers();
loadLedger();
</script>
</body>
</html>
