<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PoX マッチング</title>
<style>
  body { font-family: sans-serif; max-width: 860px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; border-bottom: 1px solid #ddd; padding-bottom: 4px; margin-top: 36px; }
  textarea { width: 100%; height: 180px; font-family: monospace; font-size: 12px; box-sizing: border-box; }
  button { padding: 6px 18px; cursor: pointer; margin-top: 6px; }
  table { border-collapse: collapse; width: 100%; margin-top: 10px; font-size: 13px; }
  th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; vertical-align: top; }
  th { background: #f5f5f5; white-space: nowrap; }
  .reason { font-size: 11px; color: #555; }
  .ok  { color: #1a8a1a; font-weight: bold; }
  .err { color: #c00; }
  select { margin: 0 6px; }
  #postMsg { margin-top: 6px; min-height: 1.2em; }
</style>
</head>
<body>
<h1>PoX マッチング プロトタイプ</h1>

<!-- ── ステップ2: 投稿 ────────────────────── -->
<h2>1. seeker を登録</h2>
<p style="margin:4px 0 6px;font-size:13px;">v3 が出力した JSON をそのまま貼り付けて送信（<code>id</code> は省略可）</p>
<textarea id="seekerJson" placeholder='{
  "id": "user_alice",
  "意志": "止まっているものを接続で動かし直したい",
  "求めている": "最初に試してくれる実証パートナー",
  "能力": "抽象概念を運用可能な構造へ落とす設計",
  "フェーズ": "mvp"
}'></textarea>
<br>
<button onclick="postSeeker()">登録</button>
<div id="postMsg"></div>

<!-- ── ステップ4: 一覧 ────────────────────── -->
<h2>2. 登録済み seeker 一覧</h2>
<button onclick="loadSeekers()">一覧を更新</button>
<table>
  <thead>
    <tr><th>id</th><th>意志（抜粋）</th><th>フェーズ</th><th>マッチング</th></tr>
  </thead>
  <tbody id="seekerRows"><tr><td colspan="4">読み込み中...</td></tr></tbody>
</table>

<!-- ── ステップ4: マッチング結果 ─────────── -->
<h2>3. マッチング結果</h2>
<div id="matchResult" style="color:#888;font-size:13px;">（一覧から「マッチング実行」を押すと表示されます）</div>

<script>
/* ── 投稿 ── */
async function postSeeker() {
  const el = document.getElementById("postMsg");
  el.className = "";
  el.textContent = "";
  let body;
  try { body = JSON.parse(document.getElementById("seekerJson").value); }
  catch (e) { el.className = "err"; el.textContent = "JSON パース失敗: " + e.message; return; }

  const res = await fetch("/seekers", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (res.ok) {
    el.className = "ok";
    el.textContent = "✅ 登録完了  id: " + data.id;
    loadSeekers();
  } else {
    el.className = "err";
    el.textContent = "エラー: " + JSON.stringify(data);
  }
}

/* ── 一覧 ── */
async function loadSeekers() {
  const res  = await fetch("/seekers");
  const rows = await res.json();
  const tbody = document.getElementById("seekerRows");
  if (!rows.length) {
    tbody.innerHTML = "<tr><td colspan='4'>まだ seeker が登録されていません</td></tr>";
    return;
  }
  tbody.innerHTML = rows.map(r => {
    const will  = (r.seeker["意志"] || "").slice(0, 40) + ((r.seeker["意志"] || "").length > 40 ? "…" : "");
    const phase = r.seeker["フェーズ"] || "-";
    const sid   = r.id.replace(/'/g, "\\'");  // シングルクォートをエスケープ
    return `<tr>
      <td><code>${r.id}</code></td>
      <td>${will}</td>
      <td>${phase}</td>
      <td>
        <select id="want_${r.id}">
          <option value="complement">相補</option>
          <option value="similar">類似</option>
          <option value="balanced">バランス</option>
        </select>
        <button onclick="runMatch('${sid}')">マッチング実行</button>
      </td>
    </tr>`;
  }).join("");
}

/* ── マッチング ── */
async function runMatch(seekerId) {
  const el   = document.getElementById("matchResult");
  const want = document.getElementById("want_" + seekerId).value;
  el.innerHTML = "<span style='color:#888'>計算中...</span>";

  const res  = await fetch("/match", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ seeker_id: seekerId, want }),
  });
  const data = await res.json();

  if (!res.ok) {
    el.innerHTML = `<span class="err">エラー: ${data.error || JSON.stringify(data)}</span>`;
    return;
  }

  const needed = (data.needed_roles || []).map(r => `「${r.role}」`).join("、");
  const rows   = data.ranking.map(r => `
    <tr>
      <td style="text-align:center">${r.rank}</td>
      <td><code>${r.id}</code></td>
      <td style="text-align:center">${r.score}</td>
      <td style="text-align:center">${r.comp}</td>
      <td style="text-align:center">${r.sim}</td>
      <td class="reason">${r.reason}</td>
    </tr>`).join("");

  el.innerHTML = `
    <p style="font-size:13px;margin:4px 0">
      <strong>seeker:</strong> ${seekerId} &nbsp;
      <strong>want:</strong> ${data.want} &nbsp;
      <strong>必要像:</strong> ${needed || "-"}
    </p>
    <table>
      <thead>
        <tr><th>順</th><th>候補 id</th><th>総合</th><th>相補</th><th>類似</th><th>根拠</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

/* 初回ロード */
loadSeekers();
</script>
</body>
</html>
