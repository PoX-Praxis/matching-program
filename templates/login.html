<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログイン — PoX</title>
<style>
  body{margin:0;color:#14161a;
       font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif}
  .lg{max-width:460px;margin:0 auto;padding:8px 20px 60px}
  .lg h1{font-size:20px;font-weight:700;margin:36px 0 6px;color:#1f3a5f}
  .lg p{font-size:14px;line-height:1.9;color:#454b54;margin:0 0 18px}
  .lg label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;color:#6b7280;margin:0 0 6px}
  .lg input[type=email]{width:100%;box-sizing:border-box;border:1px solid #cfd3d9;border-radius:5px;
       padding:12px;font:inherit;font-size:15px}
  .lg button{margin-top:14px;border:1px solid #1f3a5f;background:#1f3a5f;color:#fff;
       border-radius:6px;font-size:15px;font-weight:700;padding:12px 22px;cursor:pointer}
  .lg .err{background:#fbe9ea;color:#8c2f34;font-size:13px;line-height:1.7;
       padding:11px 13px;border-radius:4px;margin:0 0 18px}
  .lg .msg{font-size:14px;line-height:1.8;margin-top:16px}
  .lg .msg.ok{color:#1a6a3a}
  .lg .dev{font-size:12px;word-break:break-all;background:#eef2ff;border-radius:5px;
       padding:10px 12px;margin-top:10px}
  .lg .note{font-size:12px;color:#8a9099;line-height:1.8;margin-top:24px}
</style>
</head>
<body>
{% include "_nav.html" %}
<main class="lg">
  <h1>ログイン / 新規登録</h1>
  <p>メールアドレスにログイン用のリンクをお送りします。パスワードはありません。リンクは15分間有効・一度きりです。</p>

  {% if error %}<div class="err">{{ error }}</div>{% endif %}

  <label for="email">メールアドレス</label>
  <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
  <div><button id="send">ログインリンクを送る</button></div>
  <div id="msg" class="msg"></div>

  <p class="note">初めての場合、リンクを開いた時点でアカウントが作成され、プライバシーポリシーに同意したものとして記録されます。</p>
</main>

<script>
const btn = document.getElementById("send");
const msg = document.getElementById("msg");
btn.addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  msg.className = "msg"; msg.textContent = "";
  if (!email) { msg.className = "msg err"; msg.textContent = "メールアドレスを入力してください。"; return; }
  btn.disabled = true; msg.textContent = "送信中…";
  try {
    const r = await fetch("/auth/request", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ email }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "送信に失敗しました");
    msg.className = "msg ok";
    // 「送信しました」で終わらせない。届かない利用者が離脱しないよう具体的に案内する（§4-3b・§4-4）。
    msg.innerHTML =
      "✅ リンクを送信しました。数分以内にメールが届きます。" +
      '<div class="note" style="margin-top:10px">' +
      "届かない場合は次をご確認ください：" +
      "<br>・<b>迷惑メールフォルダ</b>に振り分けられていないか" +
      "<br>・<b>キャリアメール</b>（docomo / au / softbank など）をお使いの場合、" +
      "初期設定でパソコンからのメールが拒否されることがあります。" +
      "<b>受信許可リストに「pox-praxis.com」ドメインを追加</b>してから、もう一度お試しください。" +
      "<br>・それでも届かない場合は、お問い合わせください（" +
      // TODO(運営): 実在する問い合わせ先アドレスに差し替える。pox-praxis.com のメールボックスを用意すること。
      '<a href="mailto:info@pox-praxis.com">info@pox-praxis.com</a>）。' +
      "</div>";
    if (d.dev_link) {
      // 開発モード（SMTP未設定・POX_DEBUG=1）のときだけ表示される。
      msg.innerHTML += `<div class="dev">開発モード: <a href="${d.dev_link}">${d.dev_link}</a></div>`;
    }
  } catch (e) {
    msg.className = "msg err"; msg.textContent = "エラー: " + e.message;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
