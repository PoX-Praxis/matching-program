{% extends "_base.html" %}
{% block title %}マイページ — PoX{% endblock %}
{% block head %}
<style>
  body { color: #14161a; }
  a.back { font-size: 13px; color: #555; text-decoration: none; display:inline-block; margin:16px 0 0 18px; }
  a.back:hover { text-decoration: underline; }
  #loading { color: #888; margin: 40px 18px; }

  /* ══════════════════════════════════════════════════════════════
     マイページ固有セクション（ProfileView 本体はコンポーネント側）。
     ここに残すのは owner だけの周辺 UI：照合準備状態・接続カード・軌跡レーン。
     幅は .mypage が var(--prose)=720px を与える（公開ビューの .l-prose と一致）。
     ══════════════════════════════════════════════════════════════ */
  .mypage{
    --ink:#14161a; --ink2:#454b54; --label:#6b7280; --rule:#e6e8ec;
    --navy:#1f3a5f; --step-ink:#2f5d3f;
    max-width:var(--prose);
    margin-inline:auto;
    padding:16px var(--pad) 60px;
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  }

  .mypage .mp-err{
    background:#fbe9ea;color:#8c2f34;font-size:13px;line-height:1.7;
    padding:11px 13px;border-radius:4px;margin:0 0 20px;
  }
  .mypage .mp-lanenote{font-size:11.5px;line-height:1.8;color:#9aa0a8;margin:10px 0 0}

  /* ---------- 接続（カード） ---------- */
  .mypage .mp-card{border:1px solid var(--rule);border-radius:6px;padding:14px;margin-bottom:10px}
  .mypage .mp-card .row{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:3px 0}
  .mypage .mp-card .row .k{color:var(--label);font-size:11.5px;font-weight:700;letter-spacing:.06em;flex:none}

  /* ---------- 軌跡（2レーン） ---------- */
  .mypage .mp-lanes{
    display:grid;grid-template-columns:1fr 1fr;gap:1px;
    background:var(--rule);border:1px solid var(--rule);border-radius:6px;
    overflow:hidden;margin-top:14px;
  }
  .mypage .mp-lane{background:#fff;padding:14px 12px;min-height:96px}
  .mypage .mp-lane h4{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--label);margin:0 0 10px}
  .mypage .mp-lane p{font-size:12.5px;line-height:1.8;color:#9aa0a8;margin:0}
  .mypage .mp-tl{margin:0 0 12px}
  .mypage .mp-tl:last-child{margin-bottom:0}
  .mypage .mp-tl .d{color:#9aa0a8;font-size:11px;display:block;margin-bottom:2px}
  .mypage .mp-tl details > summary{cursor:pointer;color:var(--navy);font-size:12.5px}
  .mypage .mp-tl .sub{font-size:12px;line-height:1.7;color:var(--ink2);margin:3px 0}
  .mypage .mp-tl .sub.ev{color:#8a9099}
  .mypage .mp-tl a{color:var(--step-ink);text-decoration:none}
  .mypage .mp-empty{font-size:13.5px;line-height:1.8;color:#8a9099;padding:18px 0}

  /* ---------- 照合の準備状態（指示書08・枠のみ） ---------- */
  .mypage .v4status{padding:10px 14px;border-radius:6px;font-size:13px;margin:0 0 20px}
  .mypage .v4status.ok   {background:#e7f5ec;color:#1a6a3a}
  .mypage .v4status.info {background:#eef2ff;color:#33417a}
  .mypage .v4status.warn {background:#fff3cd;color:#856404}
  .mypage .v4status.err  {background:#f8d7da;color:#721c24}
  .mypage .v4status .restructure{margin-left:8px;font-weight:700;color:var(--navy);white-space:nowrap;text-decoration:none}

  /* ---------- 接続状態バッジ ---------- */
  .mypage .badge-ok     {background:#d4edda;color:#155724;border-radius:3px;padding:2px 8px;font-size:12px}
  .mypage .badge-wait   {background:#fff3cd;color:#856404;border-radius:3px;padding:2px 8px;font-size:12px}
  .mypage .badge-action {background:#f8d7da;color:#721c24;border-radius:3px;padding:2px 8px;font-size:12px}
  .mypage #notice{margin:0 0 10px;font-size:13px}
  .mypage .ok  { color:#1a8a1a; font-weight:bold; }
  .mypage .err { color:#c00; }
  .mypage .muted { color:#8a9099; font-size:12.5px; }
</style>
{% include "_profile_view.html" %}
{% endblock %}
{% block content %}
<a href="/" class="back">← トップに戻る</a>
<div id="loading">読み込み中です</div>

<main id="main" class="mypage pv" style="display:none">

  <!-- 照合の準備状態（所有者のみ・指示書08） -->
  <div id="v4Status" class="v4status" style="display:none"></div>

  <!-- ProfileView 本体（表示名編集・背景〜必要としている相手〜本人より・編集リンク）。
       PoXProfileView.render() が owner モードで流し込む。 -->
  <div id="pvRoot"></div>

  <!-- 接続（owner のみのセクション。公開ビューは代わりに接続CTA＝差3） -->
  <h2 class="pv-h">接続<span class="en">CONNECTIONS</span></h2>
  <div id="notice"></div>
  <div id="connCards"></div>

  <!-- 軌跡（2レーン） -->
  <h2 class="pv-h">軌跡<span class="en">TRAJECTORY</span></h2>
  <p class="pv-blkcap">自分の変化と、接続の記録。</p>
  <div id="timeline"><span class="muted">読み込み中です</span></div>
  <p class="mp-lanenote">並び順は時間順であり、因果ではありません。</p>

</main>

<script>
const params = new URLSearchParams(location.search);
// 同一性の根拠はセッション（サーバーが /api/me で返す）。URL の ?id= は初期表示のヒントに
// すぎず、認可には使わない。init() で必ずセッションの id に正規化する（指示書25 §2-2）。
let myId = params.get("id");

// 認証ゲート（指示書22/25）。401→/login（元画面へ）・403→権限表示。共通ハンドラに委譲。
function handleAuth(res) {
  return PoX.handle(res);
}

/* 表示名の保存（本人のみ・指示書30）。redact/30字上限はサーバー側で最終確定。
   入力欄・注記・タイトルは共通コンポーネントが出力した要素（dnInput/dnNote/pvTitle）。 */
async function saveDisplayName(btn) {
  const sid = await PoX.me();                       // 同一性はセッション
  if (!sid) { PoX.loginRedirect(); return; }
  const note = document.getElementById("dnNote");
  if (btn) btn.disabled = true;
  try {
    const res = await fetch("/api/my/display-name", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: sid, name: document.getElementById("dnInput").value || "" }),
    });
    if (PoX.handle(res)) { if (btn) btn.disabled = false; return; }
    const data = await res.json();
    if (!res.ok) { note.textContent = "エラー: " + (data.error || res.status); if (btn) btn.disabled = false; return; }
    // サーバーが確定した表示名（未設定なら subject_id）を反映。
    const shown = data.is_set ? data.display_name : "";
    document.getElementById("dnInput").value = shown;
    document.getElementById("pvTitle").textContent = shown || (data.subject_id || sid);
    note.textContent = data.is_set ? "保存しました" : "未設定にしました（IDが表示されます）";
  } catch (e) {
    note.textContent = "通信エラーが発生しました。時間をおいて再度お試しください。";
  }
  if (btn) btn.disabled = false;
}

async function init() {
  try {
    // 同一性はセッション。ログインしていなければ /login へ、していれば URL の id に関わらず
    // 自分の id を使う（古い/他人の ?id= でも自分のマイページを開く・不用意な /login 送りを防ぐ）。
    const sid = await PoX.me();
    if (!sid) { PoX.loginRedirect(); return; }
    if (myId !== sid) {
      myId = sid;
      try { history.replaceState(null, "", `/mypage?id=${encodeURIComponent(sid)}`); } catch (_) {}
    }

    // プロフィール本体は必須。取得できなければメッセージを出して終える（読み込み中で止めない）。
    const profileRes = await fetch(`/api/profile/${encodeURIComponent(myId)}`);
    if (profileRes.status === 401) { PoX.loginRedirect(); return; }
    if (!profileRes.ok) {
      document.getElementById("loading").innerHTML =
        `<span style="color:#c00">プロフィール "${escHtml(myId)}" が見つかりません。<a href="/">トップ</a>に戻って登録してください。</span>`;
      return;
    }
    const pv = await profileRes.json();

    // 接続（vessels）は本人限定の付随情報。失敗しても本体表示は止めない。
    let vessels = [];
    try {
      const ledgerRes = await fetch(`/api/my/vessels?id=${encodeURIComponent(myId)}`);
      if (ledgerRes.status === 401) { PoX.loginRedirect(); return; }
      if (ledgerRes.ok) vessels = await ledgerRes.json();
    } catch (_) { vessels = []; }

    document.getElementById("loading").style.display = "none";
    document.getElementById("main").style.display    = "block";

    // ProfileView 本体を共通コンポーネントで描画（本人ビュー）。
    // 表示名・「本人より」の編集UI、編集リンクを含む（差1）。
    PoXProfileView.render(document.getElementById("pvRoot"), pv, { mode: "owner" });
    document.getElementById("editLink").href = `/edit?id=${encodeURIComponent(myId)}`;

    try { renderConnections(vessels, myId); } catch (_) {}
    loadV4Status(myId);        // 照合の準備状態（所有者のみ）
    loadOwnerNecessity(myId);  // 自分の必要像（本文=公開・根拠は本人のみ＝差2）
    loadTimeline(myId, myId);  // 軌跡（本人ビュー）
  } catch (e) {
    document.getElementById("loading").innerHTML =
      `<span style="color:#c00">読み込みに失敗しました（${escHtml(String(e && e.message || e))}）。`
      + `<a href="#" onclick="location.reload();return false">再読み込み</a></span>`;
  }
}

/* 自由記述の保存。既存 overrides を取得してマージ（headline/keys/trajectory を消さない）。
   view_overrides は表示専用のため、必要像・ベクトルの再生成は走らない。
   textarea#freeText・#freeMsg は共通コンポーネントが出力した要素。 */
async function saveFreeText() {
  const msg = document.getElementById("freeMsg");
  msg.className = ""; msg.textContent = "保存中…";
  try {
    const curRes = await fetch(`/api/profile/${encodeURIComponent(myId)}/edit`);
    if (handleAuth(curRes)) return;
    const cur = await curRes.json();
    const overrides = (cur && cur.overrides) || {};
    overrides.free_text = document.getElementById("freeText").value;
    const res = await fetch(`/api/profile/${encodeURIComponent(myId)}/overrides`, {
      method: "PUT", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ overrides }),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.status);
    msg.className = "ok"; msg.textContent = "✅ 保存しました";
  } catch (e) {
    msg.className = "err"; msg.textContent = "保存に失敗: " + e;
  }
}

/* ══ 必要像（本人のみ・数値は出さない：指示書11 §4-4） ══════════════
   本文=公開・根拠(evidence_span)=本人のみ。描画は共通コンポーネントに委譲（差2）。 */
async function loadOwnerNecessity(id) {
  const el = document.getElementById("pvNecessity");
  if (!el) return;
  let nec;
  try {
    const r = await fetch(`/api/my/necessity?id=${encodeURIComponent(id)}`);
    if (handleAuth(r)) return;
    if (!r.ok) { el.style.display = "none"; return; }
    nec = await r.json();
  } catch (e) { el.style.display = "none"; return; }
  PoXProfileView.renderNecessity(el, nec, "owner");
}

/* ══ 照合の準備状態（指示書08 §3-4。本改修の対象外・枠のみ） ══ */
async function loadV4Status(id) {
  const el = document.getElementById("v4Status");
  if (!el) return;
  let st;
  try {
    const r = await fetch(`/v4/seekers/${encodeURIComponent(id)}/status`);
    if (!r.ok) { el.style.display = "none"; return; }
    st = await r.json();
  } catch (e) { el.style.display = "none"; return; }

  const s = st.generation_status;
  if (s === "ready") { el.style.display = "none"; return; }
  if (s === "preparing") {
    el.className = "v4status info";
    el.textContent = "準備中です。少し待ってから再読み込みしてください。";
    el.style.display = "block";
    return;
  }
  if (s === "error") {
    el.className = "v4status err";
    el.innerHTML = "準備に失敗しました。もう一度お試しください。"
      + '<button class="restructure" style="cursor:pointer" onclick="retryGeneration(\'' + id + '\', this)">再試行</button>';
    el.style.display = "block";
    return;
  }
  el.style.display = "none";   // 未知の値は出さない
}

async function retryGeneration(id, btn) {
  const el = document.getElementById("v4Status");
  if (btn) btn.disabled = true;                        // 二重押下防止（§5）
  if (el) { el.className = "v4status info"; el.textContent = "再試行を開始しました。準備中です…"; }
  try {
    const r = await fetch(`/v4/seekers/${encodeURIComponent(id)}/retry`, { method: "POST" });
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      if (el) { el.className = "v4status err";
        el.innerHTML = "再試行に失敗しました（" + (d.error || r.status) + "）。"
          + '<button class="restructure" style="cursor:pointer" onclick="retryGeneration(\'' + id + '\', this)">もう一度</button>'; }
      return;
    }
    setTimeout(() => loadV4Status(id), 2500);          // 準備完了を少し待って再表示
  } catch (e) {
    if (el) { el.className = "v4status err";
      el.innerHTML = "通信エラーが発生しました。"
        + '<button class="restructure" style="cursor:pointer" onclick="retryGeneration(\'' + id + '\', this)">もう一度</button>'; }
  }
}

/* ══ 接続（カード化。空状態は「つながる」への導線） ══════════════ */
function renderConnections(vessels, myId) {
  const mine = vessels;   // サーバー側（/api/my/vessels）で当事者分に絞り込み済み
  const el = document.getElementById("connCards");
  if (!mine.length) {
    el.innerHTML = `<p class="mp-empty">まだ接続はありません。<a href="/connect">「つながる」</a>から相手を探せます。</p>`;
    return;
  }

  el.innerHTML = mine.map(v => {
    const j        = v.joins[0] || {};
    const other    = v.founder === myId ? (j.joiner || "-") : v.founder;
    const approvers = new Set((j.approvals || []).map(a => a.from));
    const iApproved    = approvers.has(myId);
    const theyApproved = approvers.has(other);

    let badge, action = "";
    if (v.is_connected) {
      badge = `<span class="badge-ok">✅ 接続成立 ${(j.established_at || "").slice(0, 10)}</span>`;
    } else if (iApproved && !theyApproved) {
      badge = `<span class="badge-wait">⏳ ${escHtml(other)} の承認待ち</span>`;
    } else if (!iApproved && theyApproved) {
      badge  = `<span class="badge-action">⚠️ あなたの承認が必要</span>`;
      const eid = escHtml(other).replace(/'/g, "\\'");
      action = `<button class="pv-btn" onclick="doApprove('${eid}', this)">承認する</button>`;
    } else {
      badge = `<span class="badge-wait">⏳ 処理中</span>`;
    }

    const dmHref = `/conversation?me=${encodeURIComponent(myId)}&with=${encodeURIComponent(other)}`;
    const otherCell = other !== "-"
      ? `<a href="/profile/${encodeURIComponent(other)}">${escHtml(other)}</a>
         <a href="${dmHref}" style="margin-left:10px;font-size:12px;color:#1f3a5f">DM →</a>`
      : "-";

    return `<div class="mp-card">
      <div class="row"><span class="k">相手</span><span>${otherCell}</span></div>
      <div class="row"><span class="k">状態</span><span>${badge}</span></div>
      ${action ? `<div class="row"><span class="k">操作</span><span>${action}</span></div>` : ""}
    </div>`;
  }).join("");
}

async function doApprove(otherId, btn) {
  const msg = document.getElementById("notice");
  const sid = await PoX.me();                        // 同一性はセッション（§2）
  if (!sid) { PoX.loginRedirect(); return; }
  if (btn) btn.disabled = true;                      // 二重押下防止（§5）
  msg.className = ""; msg.textContent = "承認処理中...";
  let res;
  try {
    res = await fetch("/approve", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ to_id: otherId }),
    });
  } catch (e) {
    msg.className = "err"; msg.textContent = "通信エラーが発生しました。時間をおいて再度お試しください。";
    if (btn) btn.disabled = false; return;
  }
  if (PoX.handle(res, { on403: m => { msg.className = "err"; msg.textContent = m; } })) { if (btn) btn.disabled = false; return; }
  const data = await res.json();
  if (!res.ok) {
    msg.className = "err"; msg.textContent = "エラー: " + JSON.stringify(data);
    if (btn) btn.disabled = false; return;
  }
  if (data.established) {
    msg.className = "ok"; msg.textContent = `🎉 接続成立！`;
  } else {
    msg.className = ""; msg.textContent = `✅ 承認しました。相手の承認待ちです。`;
  }
  const ledgerRes = await fetch(`/api/my/vessels?id=${encodeURIComponent(myId)}`);
  if (handleAuth(ledgerRes)) return;
  renderConnections(await ledgerRes.json(), myId);
}

/* ══ 軌跡（2レーン）══════════════════════════════════════════════
   「自分の変化」と「接続」を並走させる。接続は成立/終了の事実のみ・数値はUIに出さない。 */
function tlDate(at) { return at ? new Date(at).toLocaleDateString("ja-JP") : ""; }
function tlConnLabel(ev) {
  return ev === "established" ? "接続成立" : (ev === "ended" ? "接続終了" : escHtml(ev || ""));
}
async function loadTimeline(userId, viewer) {
  const el = document.getElementById("timeline");
  if (!el) return;
  let data;
  try {
    const q = viewer ? `?viewer=${encodeURIComponent(viewer)}` : "";
    data = await (await fetch(`/api/timeline/${encodeURIComponent(userId)}${q}`)).json();
  } catch (e) { el.innerHTML = `<span class="muted">軌跡を読み込めませんでした。</span>`; return; }

  const items = (data && data.items) || [];
  const owner = data.viewer_role === "owner";
  const changeLane = [];
  const connLane   = [];

  for (const it of items) {
    const d = tlDate(it.at);
    if (it.kind === "connection") {
      const other = it.other || "?";
      connLane.push(`<div class="mp-tl"><span class="d">${escHtml(d)}</span>
        <a href="/profile/${encodeURIComponent(other)}">${escHtml(other)}</a> と${tlConnLabel(it.event)}</div>`);
      continue;
    }
    if (it.hidden) {
      changeLane.push(`<div class="mp-tl"><span class="d">${escHtml(d)}</span>
        <span class="muted">この時点の内容は非公開です</span></div>`);
      continue;
    }
    const will = it.will_text ? `<div class="sub"><b>意志:</b> ${escHtml(it.will_text)}</div>` : "";
    const nec  = it.necessity_text ? `<div class="sub"><b>必要としている相手:</b> ${escHtml(it.necessity_text)}</div>` : "";
    const ev   = it.evidence_span ? `<div class="sub ev"><b>根拠:</b> ${escHtml(it.evidence_span)}</div>` : "";
    let toggle = "";
    if (owner && it.snapshot_id) {
      toggle = `<div class="sub"><label style="font-size:11.5px;color:#666">
        <input type="checkbox" ${it.vulnerable_hidden ? "checked" : ""}
          onchange="toggleHidden('${it.snapshot_id}', this.checked, this)">
        この時点の内容を他の人に見せない</label></div>`;
    }
    changeLane.push(`<div class="mp-tl"><span class="d">${escHtml(d)}</span>
      <details><summary>プロフィールを更新</summary>${will}${nec}${ev}${toggle}</details></div>`);
  }

  el.innerHTML = `<div class="mp-lanes">
    <div class="mp-lane"><h4>自分の変化</h4>${changeLane.length ? changeLane.join("") : "<p>まだありません</p>"}</div>
    <div class="mp-lane"><h4>接続</h4>${connLane.length ? connLane.join("") : "<p>まだありません</p>"}</div>
  </div>`;
}

/* 脆弱な時点を第三者に伏せる/戻す（消さない・当事者相手には見える）。 */
async function toggleHidden(sid, hidden, cb) {
  try {
    const r = await fetch(`/api/snapshot/${encodeURIComponent(sid)}/visibility`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ id: myId, hidden }),
    });
    if (handleAuth(r)) return;
    if (!r.ok) throw new Error();
  } catch (e) { cb.checked = !hidden; alert("変更に失敗しました"); }
}

const escHtml = PoXProfileView.esc;   // 共通エスケープを再利用

init();
</script>
{% endblock %}
