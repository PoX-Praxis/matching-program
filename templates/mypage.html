<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>マイページ — PoX</title>
<style>
  body { font-family: sans-serif; max-width: 860px; margin: 40px auto; padding: 0 16px; color: #222; }
  a.back { font-size: 13px; color: #555; text-decoration: none; }
  a.back:hover { text-decoration: underline; }
  h1  { font-size: 1.3rem; margin: 12px 0 4px; }
  h2  { font-size: 1.05rem; border-bottom: 1px solid #ddd; padding-bottom: 4px; margin-top: 32px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 10px; }
  th, td { border: 1px solid #ddd; padding: 7px 10px; text-align: left; vertical-align: top; }
  th { background: #f5f5f5; width: 160px; white-space: nowrap; }
  details > summary { cursor: pointer; color: #555; font-size: 12px; }
  button.sm { padding: 3px 12px; font-size: 12px; cursor: pointer; }
  .badge-ok     { background: #d4edda; color: #155724; border-radius: 3px; padding: 2px 8px; font-size: 12px; }
  .badge-wait   { background: #fff3cd; color: #856404; border-radius: 3px; padding: 2px 8px; font-size: 12px; }
  .badge-action { background: #f8d7da; color: #721c24; border-radius: 3px; padding: 2px 8px; font-size: 12px; }
  #notice { margin-top: 6px; font-size: 13px; }
  .ok  { color: #1a8a1a; font-weight: bold; }
  .err { color: #c00; }

  /* v4 profile blocks */
  .headline-text { font-size: 1.05rem; line-height: 1.7; color: #333; margin: 12px 0 16px; }

  .will-block { background: #f0f4ff; border-left: 4px solid #1a3a5c;
                padding: 14px 18px; border-radius: 0 6px 6px 0; margin: 12px 0 14px; }
  .will-label { font-size: 11px; font-weight: bold; color: #1a3a5c; text-transform: uppercase;
                letter-spacing: .05em; margin-bottom: 6px; }
  .will-text  { font-size: 13px; line-height: 1.7; margin: 0; color: #222; }

  .state-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 12px 0 16px; }
  .state-item { background: #f7f9fc; border-radius: 6px; padding: 12px 14px; }
  .state-label { font-size: 11px; font-weight: bold; color: #555; display: block; margin-bottom: 5px; }
  .state-text  { font-size: 13px; line-height: 1.6; margin: 0; color: #333; }

  /* v3 backward compat */
  .triangle-block { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin: 16px 0; }
  .tri-item  { background: #f7f9fc; border-radius: 6px; padding: 14px 16px; }
  .tri-label { font-size: 11px; font-weight: bold; color: #1a56bb; display: block; margin-bottom: 6px; }
  .tri-text  { font-size: 13px; line-height: 1.65; margin: 0; color: #333; }
  .phase-badge { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px; }
  .phase-tag   { background: #e8f0fe; color: #1a56bb; border-radius: 3px; padding: 2px 8px; font-size: 12px; }
  .phase-unconfirmed { background: #fff3cd; color: #856404; border-radius: 3px; padding: 2px 6px; font-size: 11px; }

  /* shared accordion */
  details.detail-block { margin: 14px 0; border: 1px solid #e0e0e0; border-radius: 6px; }
  details.detail-block > summary { padding: 10px 14px; font-size: 13px; color: #555; user-select: none; }
  details.detail-block > summary:hover { background: #f7f7f7; border-radius: 6px; }
  .detail-inner { padding: 12px 16px 16px; }
  .keys-label, .traj-label { font-size: 11px; font-weight: bold; color: #555; margin-bottom: 8px; }
  .key-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .key-tag  { background: #f0f4ff; border: 1px solid #c5d3f0; color: #1a3a8c; border-radius: 20px; padding: 3px 12px; font-size: 12px; }
  .traj-item  { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; font-size: 13px; }
  .traj-from  { background: #f5f5f5; border-radius: 4px; padding: 4px 10px; color: #444; flex: 1; }
  .traj-arrow { color: #aaa; flex-shrink: 0; padding-top: 4px; }
  .traj-to    { background: #eaf4ea; border-radius: 4px; padding: 4px 10px; color: #1a5c1a; flex: 1; }

  /* v4.3 再構成: 背景 + 意志/現状/足りないもの/本人より の縦積み */
  .bg-text { font-size: 13px; line-height: 1.7; color: #666; margin: 10px 0 20px; }
  .pblock { margin: 0 0 22px; }
  .block-heading { font-size: 12px; font-weight: bold; color: #1a3a5c; letter-spacing: .04em;
                   border-left: 4px solid #1a3a5c; padding-left: 8px; margin-bottom: 10px; }
  .tier { margin: 0 0 10px; }
  .tier-label { font-size: 11px; font-weight: bold; color: #555; display: block; margin-bottom: 3px; }
  .tier-text  { font-size: 13px; line-height: 1.7; margin: 0; color: #222; }
  .slot { margin: 0 0 10px; }
  .slot-label { font-size: 11px; font-weight: bold; color: #555; display: block; margin-bottom: 3px; }
  .slot-text  { font-size: 13px; line-height: 1.65; margin: 0; color: #333; }
  .freetext-area { width: 100%; min-height: 90px; font-family: inherit; font-size: 13px;
                   box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; padding: 10px; }
  .freetext-note { font-size: 11px; color: #999; margin: 4px 0 8px; }
  .freetext-ro { font-size: 13px; line-height: 1.7; color: #333; white-space: pre-wrap; margin: 0; }

  /* 照合の準備状態（所有者のみ・指示書08 §3-4）*/
  .v4status { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin: 12px 0 4px; }
  .v4status.ok   { background:#e7f5ec; color:#1a6a3a; }
  .v4status.info { background:#eef2ff; color:#33417a; }
  .v4status.warn { background:#fff3cd; color:#856404; }
  .v4status.err  { background:#f8d7da; color:#721c24; }
  .v4status .restructure { margin-left:8px; font-weight:bold; color:#1a3a5c; white-space:nowrap; text-decoration:none; }

  #loading { color: #888; margin-top: 40px; }
  @media (max-width: 600px) {
    .state-grid { grid-template-columns: 1fr; }
    .triangle-block { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
{% include "_nav.html" %}
<a href="/" class="back">← トップに戻る</a>
<div id="loading">読み込み中...</div>
<div id="main" style="display:none">

  <h1 id="pageTitle"></h1>

  <div id="v4Status" style="display:none"></div>

  <h2>プロフィール</h2>
  <div id="profileBlock"></div>

  <div style="margin-top:12px">
    <a id="editLink" href="#" style="display:inline-block;padding:6px 18px;background:#f0f0f0;border:1px solid #ccc;color:#333;border-radius:4px;text-decoration:none;font-size:13px">プロフィールを編集する</a>
  </div>

  <h2>接続状況</h2>
  <div id="notice"></div>
  <table>
    <thead>
      <tr><th>vessel</th><th>相手</th><th>状態</th><th>アクション</th></tr>
    </thead>
    <tbody id="connRows"><tr><td colspan="4">まだ接続記録はありません</td></tr></tbody>
  </table>

</div>

<script>
const params = new URLSearchParams(location.search);
const myId = params.get("id");
if (!myId) {
  document.getElementById("loading").innerHTML =
    '<span style="color:#c00">URL に ?id= が指定されていません。<a href="/">トップ</a>から「マイページ」を開いてください。</span>';
}

async function init() {
  if (!myId) return;

  const [profileRes, ledgerRes] = await Promise.all([
    fetch(`/api/profile/${encodeURIComponent(myId)}`),
    fetch("/ledger"),
  ]);

  if (!profileRes.ok) {
    document.getElementById("loading").innerHTML =
      `<span style="color:#c00">プロフィール "${myId}" が見つかりません。<a href="/">トップ</a>に戻って登録してください。</span>`;
    return;
  }

  const pv      = await profileRes.json();
  const vessels = await ledgerRes.json();

  document.getElementById("loading").style.display = "none";
  document.getElementById("main").style.display    = "block";
  document.getElementById("pageTitle").textContent = myId;
  document.getElementById("editLink").href = `/edit?id=${encodeURIComponent(myId)}`;

  renderProfileView(pv);
  renderConnections(vessels, myId);
  loadV4Status(myId);   // 照合の準備状態（所有者のみ）
}

/* 照合の準備状態を本人のマイページにのみ表示（指示書08 §3-4）。
   v4未登録・非Postgres・エラー時は黙って非表示にし、ページを壊さない。 */
async function loadV4Status(id) {
  const el = document.getElementById("v4Status");
  if (!el) return;
  let st;
  try {
    const r = await fetch(`/v4/seekers/${encodeURIComponent(id)}/status`);
    if (!r.ok) { el.style.display = "none"; return; }
    st = await r.json();
  } catch (e) { el.style.display = "none"; return; }

  const s = st.generation_status;
  if (s === "needs_regeneration") {
    el.className = "v4status warn";
    el.innerHTML = "プロフィールを編集したため、必要像が古くなっています。"
      + "より正確な照合のため、再構造化をおすすめします。"
      + '<a href="/register" class="restructure">再構造化する →</a>';
    el.style.display = "block";
    return;
  }
  const map = {
    preparing: ["照合の準備中です", "info"],
    ready:     ["照合可能な状態です", "ok"],
    error:     ["照合準備でエラーが発生しました", "err"],
  };
  const m = map[s];
  if (!m) { el.style.display = "none"; return; }
  el.className = "v4status " + m[1];
  el.textContent = m[0];
  el.style.display = "block";
}

function renderProfileView(pv) {
  const container = document.getElementById("profileBlock");
  if (pv.schema_version === "v4") {
    container.innerHTML = renderV4(pv);
  } else {
    let html = "";
    if (pv.headline) html += `<p class="headline-text">${escHtml(pv.headline)}</p>`;
    container.innerHTML = html + renderV3(pv);
  }
}

/* ── v4.3 レイアウト: 背景 → 意志 → 現状 → 足りないもの → 本人より ── */
function renderV4(pv) {
  let h = "";

  // 背景（マイページでは小さく・冒頭）。無ければ headline にフォールバック
  const bg = pv.background || pv.headline || "";
  if (bg) h += `<p class="bg-text">${escHtml(bg)}</p>`;

  // ブロック1「意志」— 上から下へ一段ずつ深く（順序固定）
  const willWhere = pv.will_where || pv.pursuing || "";
  h += `<section class="pblock"><div class="block-heading">意志</div>`;
  h += tierHtml("いま目指していること", willWhere);
  if (pv.will_why)    h += tierHtml("その根にある捉え方", pv.will_why);
  if (pv.will_origin) h += tierHtml("そう考えるに至った経験", pv.will_origin);
  h += `</section>`;

  // ブロック2「現状」— 縦積み
  const slots = [
    ["持っているもの", pv.state_have],
    ["繰り返し現れる固有の型", pv.state_can_type],
    ["縛られているもの", pv.state_bound],
  ];
  if (slots.some(s => s[1]) || pv.state_unsorted) {
    h += `<section class="pblock"><div class="block-heading">現状</div>`;
    for (const [label, val] of slots) h += slotHtml(label, val || "—");
    if (pv.state_unsorted) h += slotHtml("その他", pv.state_unsorted);  // 空なら非表示
    h += `</section>`;
  }

  // ブロック3「足りないもの」— 常時表示（折りたたまない）
  const seekingText = (pv.seeking && pv.seeking !== "未取得") ? pv.seeking : "";
  h += `<section class="pblock"><div class="block-heading">足りないもの</div>`;
  h += `<div class="slot"><span class="slot-label">次の一歩</span>${trajInlineHtml(pv.trajectory)}</div>`;
  h += slotHtml("求めている", seekingText || "—");
  h += `</section>`;

  // ブロック4「本人より」— 自由記述（所有者のマイページは編集可）
  h += freeTextEditor(pv.free_text || "");
  return h;
}

function tierHtml(label, val) {
  return `<div class="tier"><span class="tier-label">${escHtml(label)}</span>
    <p class="tier-text">${escHtml(val || "—")}</p></div>`;
}
function slotHtml(label, val) {
  return `<div class="slot"><span class="slot-label">${escHtml(label)}</span>
    <p class="slot-text">${escHtml(val)}</p></div>`;
}
function trajInlineHtml(trajectory) {
  if (!trajectory || !trajectory.length) return `<p class="slot-text">—</p>`;
  return trajectory.map(t => `<div class="traj-item">
    <span class="traj-from">${escHtml(t.from)}</span>
    <span class="traj-arrow">→</span>
    <span class="traj-to">${escHtml(t.to)}</span>
  </div>`).join("");
}

function freeTextEditor(val) {
  return `<section class="pblock"><div class="block-heading">本人より</div>
    <textarea id="freeText" class="freetext-area"
      placeholder="自己紹介や補足を自由に書けます（AIは生成にも編集にも関与しません）">${escHtml(val)}</textarea>
    <div class="freetext-note">※ ここに書いた内容は、そのまま公開プロフィールに表示されます。</div>
    <button class="sm" onclick="saveFreeText()">「本人より」を保存</button>
    <span id="freeMsg" style="font-size:12px;margin-left:8px"></span>
  </section>`;
}

/* 自由記述の保存。既存 overrides を取得してマージ（headline/keys/trajectory を消さない）。
   view_overrides は表示専用のため、必要像・ベクトルの再生成は走らない。 */
async function saveFreeText() {
  const msg = document.getElementById("freeMsg");
  msg.className = ""; msg.textContent = "保存中…";
  try {
    const cur = await fetch(`/api/profile/${encodeURIComponent(myId)}/edit`).then(r => r.json());
    const overrides = (cur && cur.overrides) || {};
    overrides.free_text = document.getElementById("freeText").value;
    const res = await fetch(`/api/profile/${encodeURIComponent(myId)}/overrides`, {
      method: "PUT", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ overrides }),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.status);
    msg.className = "ok"; msg.textContent = "✅ 保存しました";
  } catch (e) {
    msg.className = "err"; msg.textContent = "保存に失敗: " + e;
  }
}

/* ── v3 後方互換レイアウト（現状維持）── */
function renderV3(pv) {
  let h = "";
  const badge = pv.phase_badge || {};
  if (badge.value) {
    h += `<div class="phase-badge">
      <span class="phase-tag">${escHtml(badge.value)}</span>
      ${badge.unconfirmed ? '<span class="phase-unconfirmed">AI推定・未確定</span>' : ""}
    </div>`;
  }
  h += `<div class="triangle-block">
    <div class="tri-item"><span class="tri-label">意志</span><p class="tri-text">${escHtml(pv.pursuing || "—")}</p></div>
    <div class="tri-item"><span class="tri-label">求めている</span><p class="tri-text">${escHtml(pv.needs || "—")}</p></div>
    <div class="tri-item"><span class="tri-label">能力</span><p class="tri-text">${escHtml(pv.offering || "—")}</p></div>
  </div>`;
  const hasDetail = (pv.keys && pv.keys.length) || (pv.trajectory && pv.trajectory.length);
  if (hasDetail) {
    h += `<details class="detail-block"><summary>注目ポイント・軌跡を見る</summary>
      <div class="detail-inner">${buildKeysHtml(pv.keys)}${buildTrajHtml(pv.trajectory)}</div></details>`;
  }
  return h;
}

function buildKeysHtml(keys) {
  if (!keys || !keys.length) return "";
  return `<div><div class="keys-label">注目ポイント</div>
    <div class="key-tags">${keys.map(k => `<span class="key-tag">${escHtml(k)}</span>`).join("")}</div></div>`;
}

function buildTrajHtml(trajectory) {
  if (!trajectory || !trajectory.length) return "";
  return `<div><div class="traj-label">現在の軌跡</div>
    ${trajectory.map(t => `<div class="traj-item">
      <span class="traj-from">${escHtml(t.from)}</span>
      <span class="traj-arrow">→</span>
      <span class="traj-to">${escHtml(t.to)}</span>
    </div>`).join("")}</div>`;
}

function renderConnections(vessels, myId) {
  const mine = vessels.filter(v =>
    v.founder === myId || (v.joins[0]?.joiner === myId)
  );
  const tbody = document.getElementById("connRows");
  if (!mine.length) {
    tbody.innerHTML = "<tr><td colspan='4'>まだ接続記録はありません</td></tr>";
    return;
  }

  tbody.innerHTML = mine.map(v => {
    const j        = v.joins[0] || {};
    const other    = v.founder === myId ? (j.joiner || "-") : v.founder;
    const approvers = new Set((j.approvals || []).map(a => a.from));
    const iApproved    = approvers.has(myId);
    const theyApproved = approvers.has(other);

    let badge, action = "";
    if (v.is_connected) {
      badge = `<span class="badge-ok">✅ 接続成立 ${(j.established_at || "").slice(0, 10)}</span>`;
    } else if (iApproved && !theyApproved) {
      badge = `<span class="badge-wait">⏳ ${escHtml(other)} の承認待ち</span>`;
    } else if (!iApproved && theyApproved) {
      badge  = `<span class="badge-action">⚠️ あなたの承認が必要</span>`;
      const eid = escHtml(other).replace(/'/g, "\\'");
      action = `<button class="sm" onclick="doApprove('${eid}')">承認する</button>`;
    } else {
      badge = `<span class="badge-wait">⏳ 処理中</span>`;
    }

    const dmHref = `/conversation?me=${encodeURIComponent(myId)}&with=${encodeURIComponent(other)}`;
    const otherLink = other !== "-"
      ? `<a href="/profile/${encodeURIComponent(other)}" style="font-family:monospace">${escHtml(other)}</a>`
      : "-";
    const dmBtn = other !== "-"
      ? `<a href="${dmHref}" style="margin-left:8px;font-size:12px;color:#1a3a5c">DM →</a>`
      : "";
    return `<tr>
      <td><code style="font-size:11px">${escHtml(v.vessel_id)}</code></td>
      <td>${otherLink}${dmBtn}</td>
      <td>${badge}</td>
      <td>${action}</td>
    </tr>`;
  }).join("");
}

async function doApprove(otherId) {
  const msg = document.getElementById("notice");
  const res = await fetch("/approve", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ from_id: myId, to_id: otherId }),
  });
  const data = await res.json();
  if (!res.ok) {
    msg.className = "err"; msg.textContent = "エラー: " + JSON.stringify(data); return;
  }
  if (data.established) {
    msg.className = "ok"; msg.textContent = `🎉 接続成立！  vessel: ${data.vessel_id}`;
  } else {
    msg.className = ""; msg.textContent = `✅ 承認しました（vessel: ${data.vessel_id}）。相手の承認待ちです。`;
  }
  const ledgerRes = await fetch("/ledger");
  renderConnections(await ledgerRes.json(), myId);
}

function escHtml(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

init();
</script>
</body>
</html>
