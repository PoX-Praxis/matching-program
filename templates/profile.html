{% extends "_base.html" %}
{% block title %}プロフィール — PoX{% endblock %}
{% block head %}
<style>
  a.back { font-size: 13px; color: #555; text-decoration: none; }
  a.back:hover { text-decoration: underline; }

  /* 軌跡・つながる（ProfileView 本体はコンポーネント側。ここは接続CTA＝差3 と軌跡のみ） */
  .muted { color:#888; font-size:13px; }
  .tl-item { display:flex; gap:10px; padding:8px 4px; border-bottom:1px solid #eee; font-size:13px; }
  .tl-date { color:#888; font-size:12px; white-space:nowrap; min-width:88px; }
  .tl-conn .tl-body { color:#1a6a3a; }
  .tl-sub { margin:3px 0; font-size:12px; line-height:1.6; }

  /* connect（接続CTA＝差3） */
  .connect-block { margin: 28px 0 8px; }
  .want-row  { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .want-label { font-size: 12px; color: #555; }
  .want-select { font-size: 13px; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; }
  .btn { padding: 9px 22px; cursor: pointer; border: none; border-radius: 5px; font-size: 14px; font-weight: bold; }
  .btn-connect { background: #1a3a5c; color: white; }
  .btn-connect:hover { background: #122840; }
  .btn-msg { background: #f0f0f0; border: 1px solid #ccc; color: #333; }
  .btn-msg:hover { background: #e4e4e4; }
  #notice { margin-top: 10px; font-size: 13px; }
  .ok  { color: #1a8a1a; font-weight: bold; }
  .err { color: #c00; }
  #loading { color: #888; margin-top: 40px; }
</style>
{% include "_profile_view.html" %}
{% endblock %}
{% block content %}
<main class="l-prose pv">
<a href="/" class="back">← トップに戻る</a>
<div id="loading">読み込み中です</div>
<div id="main" style="display:none">

  <!-- ProfileView 本体（背景〜本人より）。PoXProfileView.render() が流し込む。 -->
  <div id="pvRoot"></div>

  <!-- connect actions（接続CTA＝差3。owner ビューには無い） -->
  <div class="connect-block" id="connectBlock" style="display:none">
    <h2 class="pv-h">つながる<span class="en">CONNECT</span></h2>
    <div class="want-row">
      <span class="want-label">照合の方向性：</span>
      <select class="want-select" id="wantMode">
        <option value="complement">補完（現状・役割が違う人）</option>
        <option value="similar">共鳴（意志が近い人）</option>
        <option value="balanced" selected>バランス（両方）</option>
      </select>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-connect" onclick="doConnect(this)">この人とつながる</button>
      <button class="btn btn-msg" onclick="sendMsg()">メッセージを送る</button>
    </div>
    <!-- 未ログイン時の注記（指示書37 §4）。ボタンは活性のまま・押下でログイン導線へ。 -->
    <p id="loginNote" style="display:none;font-size:13px;color:#888;margin:8px 0 0">つながる・メッセージにはログインが必要です。</p>
    <div id="notice"></div>
  </div>

  <h2 class="pv-h" style="margin-top:44px">軌跡<span class="en">TRAJECTORY</span></h2>
  <div id="timeline"><span class="muted">読み込み中です</span></div>

</div>

<script>
const pathParts = location.pathname.split("/");
const profileId = decodeURIComponent(pathParts[pathParts.length - 1]);

async function init() {
  // 「自分のプロフィールならマイページへ」の判定はセッション基準（指示書26）。
  const sid = await PoX.me();
  if (sid && sid === profileId) {
    location.replace(`/mypage?id=${encodeURIComponent(sid)}`);
    return;
  }

  const res = await fetch(`/api/profile/${encodeURIComponent(profileId)}`);
  if (!res.ok) {
    document.getElementById("loading").innerHTML =
      `<span style="color:#c00">プロフィール "${profileId}" が見つかりません。</span>`;
    return;
  }
  const pv = await res.json();
  document.getElementById("loading").style.display = "none";
  document.getElementById("main").style.display = "block";

  // ProfileView 本体を共通コンポーネントで描画（公開ビュー）。
  PoXProfileView.render(document.getElementById("pvRoot"), pv, { mode: "public" });
  // 必要としている相手（必要像）。公開ビューは necessity_text のみ・根拠は出さない（差2）。
  PoXProfileView.renderNecessity(document.getElementById("pvNecessity"), pv, "public");

  loadTimeline(profileId, sid);   // viewer はセッション本人（未ログインは null＝第三者ビュー）

  // 他人のプロフィール（未ログイン含む）は接続ブロックを表示（差3）。
  document.getElementById("connectBlock").style.display = "block";
  if (!sid) document.getElementById("loginNote").style.display = "block";
}

async function doConnect(btn) {
  const notice = document.getElementById("notice");
  const sid = await PoX.me();                       // 同一性はセッション（§2）
  if (!sid) { PoX.loginRedirect(); return; }
  const want = document.getElementById("wantMode").value;
  if (btn) btn.disabled = true;                     // 二重押下防止（§5）
  notice.textContent = "照合中...";
  notice.className = "";
  try {
    const mRes = await fetch("/match", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ seeker_id: sid, want }),
    });
    if (PoX.handle(mRes, { on403: m => { notice.className = "err"; notice.textContent = m; } })) { if (btn) btn.disabled = false; return; }
    const mData = await mRes.json();
    if (!mRes.ok) {
      notice.className = "err";
      notice.textContent = "照合エラー: " + (mData.error || JSON.stringify(mData));
      if (btn) btn.disabled = false; return;
    }
    const matchRunId = mData.match_run_id;
    const ranking = mData.ranking || [];
    const matchEntry = ranking.find(r => r.id === profileId);
    const predictedRole = matchEntry?.predicted_role || null;

    notice.textContent = "接続処理中...";
    const aRes = await fetch("/approve", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ to_id: profileId, match_run_id: matchRunId, predicted_role: predictedRole }),
    });
    if (PoX.handle(aRes, { on403: m => { notice.className = "err"; notice.textContent = m; } })) { if (btn) btn.disabled = false; return; }
    const aData = await aRes.json();
    if (!aRes.ok) {
      notice.className = "err";
      notice.textContent = "接続エラー: " + (aData.error || JSON.stringify(aData));
      if (btn) btn.disabled = false; return;
    }
    if (aData.established) {
      notice.className = "ok";
      notice.textContent = `🎉 接続成立！`;
    } else {
      notice.className = "ok";
      notice.textContent = `✅ 接続を申請しました。相手の承認をお待ちください。`;
    }
    // 成功後はボタンを無効のまま（重複申請を防ぐ）
  } catch (e) {
    notice.className = "err";
    notice.textContent = "通信エラーが発生しました。時間をおいて再度お試しください。";
    if (btn) btn.disabled = false;
  }
}

async function sendMsg() {
  const sid = await PoX.me();                       // 同一性はセッション（指示書26）
  if (!sid) { PoX.loginRedirect(); return; }        // 未ログインは /login へ（白画面/生エラーにしない）
  location.href = `/conversation?me=${encodeURIComponent(sid)}&with=${encodeURIComponent(profileId)}`;
}

const escHtml = PoXProfileView.esc;   // 共通エスケープを再利用

/* 軌跡（第三者/当事者の相手ビュー）: 公開範囲はサーバーが閲覧者役割で絞る。
   接続は成立/終了の「事実」のみ・理由なし。evidence_span/数値は出ない。
   第三者に伏せられた時点は「非公開」表示（事実は残る）。 */
async function loadTimeline(userId, viewer) {
  const el = document.getElementById("timeline");
  if (!el) return;
  let data;
  try {
    const q = viewer ? `?viewer=${encodeURIComponent(viewer)}` : "";
    data = await (await fetch(`/api/timeline/${encodeURIComponent(userId)}${q}`)).json();
  } catch (e) { el.innerHTML = `<span class="muted">軌跡を読み込めませんでした。</span>`; return; }
  const items = (data && data.items) || [];
  if (!items.length) { el.innerHTML = `<span class="muted">まだ軌跡はありません。</span>`; return; }
  el.innerHTML = items.map(it => {
    const d = it.at ? new Date(it.at).toLocaleDateString("ja-JP") : "";
    if (it.kind === "connection") {
      const label = it.event === "established" ? "接続成立" : (it.event === "ended" ? "接続終了" : escHtml(it.event || ""));
      const other = it.other || "?";
      return `<div class="tl-item tl-conn"><span class="tl-date">${escHtml(d)}</span>
        <span class="tl-body"><a href="/profile/${encodeURIComponent(other)}">${escHtml(other)}</a> と${label}</span></div>`;
    }
    if (it.hidden) {
      return `<div class="tl-item tl-snap"><span class="tl-date">${escHtml(d)}</span>
        <div class="tl-body"><span class="muted">この時点の内容は非公開です</span></div></div>`;
    }
    const will = it.will_text ? `<div class="tl-sub"><b>意志:</b> ${escHtml(it.will_text)}</div>` : "";
    const nec  = it.necessity_text ? `<div class="tl-sub"><b>必要としている相手:</b> ${escHtml(it.necessity_text)}</div>` : "";
    return `<div class="tl-item tl-snap"><span class="tl-date">${escHtml(d)}</span>
      <div class="tl-body"><details><summary>プロフィールを更新</summary>${will}${nec}</details></div></div>`;
  }).join("");
}

init();
</script>
</main>
{% endblock %}
