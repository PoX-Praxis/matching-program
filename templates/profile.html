<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>プロフィール — PoX</title>
<style>
  body { font-family: sans-serif; max-width: 860px; margin: 40px auto; padding: 0 16px; color: #222; }
  a.back { font-size: 13px; color: #555; text-decoration: none; }
  a.back:hover { text-decoration: underline; }
  h2 { font-size: 1.05rem; border-bottom: 1px solid #ddd; padding-bottom: 4px; margin-top: 32px; }

  /* v4 blocks */
  .headline-text { font-size: 1.05rem; line-height: 1.7; color: #333; margin: 20px 0 12px; }

  .will-block { background: #f0f4ff; border-left: 4px solid #1a3a5c;
                padding: 14px 18px; border-radius: 0 6px 6px 0; margin: 12px 0 14px; }
  .will-label { font-size: 11px; font-weight: bold; color: #1a3a5c; text-transform: uppercase;
                letter-spacing: .05em; margin-bottom: 6px; }
  .will-text  { font-size: 13px; line-height: 1.7; margin: 0; color: #222; }

  .state-grid  { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 12px 0 16px; }
  .state-item  { background: #f7f9fc; border-radius: 6px; padding: 12px 14px; }
  .state-label { font-size: 11px; font-weight: bold; color: #555; display: block; margin-bottom: 5px; }
  .state-text  { font-size: 13px; line-height: 1.6; margin: 0; color: #333; }

  /* v3 backward compat */
  .triangle-block { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin: 20px 0; }
  .tri-item  { background: #f7f9fc; border-radius: 6px; padding: 14px 16px; }
  .tri-label { font-size: 11px; font-weight: bold; color: #1a56bb; text-transform: uppercase;
               letter-spacing: .04em; display: block; margin-bottom: 6px; }
  .tri-text  { font-size: 13px; line-height: 1.65; margin: 0; color: #333; }
  .phase-badge      { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .phase-tag        { background: #e8f0fe; color: #1a56bb; border-radius: 3px; padding: 2px 8px; font-size: 12px; }
  .phase-unconfirmed { background: #fff3cd; color: #856404; border-radius: 3px; padding: 2px 6px; font-size: 11px; }

  /* v4.3 再構成: 背景（他人ビューは大きく）+ 意志/現状/足りないもの/本人より */
  .bg-text-lg { font-size: 1.05rem; line-height: 1.75; color: #333; margin: 18px 0 22px; }
  .pblock { margin: 0 0 22px; }
  .block-heading { font-size: 12px; font-weight: bold; color: #1a3a5c; letter-spacing: .04em;
                   border-left: 4px solid #1a3a5c; padding-left: 8px; margin-bottom: 10px; }
  .tier { margin: 0 0 10px; }
  .tier-label { font-size: 11px; font-weight: bold; color: #555; display: block; margin-bottom: 3px; }
  .tier-text  { font-size: 13px; line-height: 1.7; margin: 0; color: #222; }
  .slot { margin: 0 0 10px; }
  .slot-label { font-size: 11px; font-weight: bold; color: #555; display: block; margin-bottom: 3px; }
  .slot-text  { font-size: 13px; line-height: 1.65; margin: 0; color: #333; }
  .freetext-ro { font-size: 13px; line-height: 1.7; color: #333; white-space: pre-wrap; margin: 0; }
  .ai-note { font-size: 10px; font-weight: normal; color: #888; background: #f0f0f0;
             border-radius: 3px; padding: 1px 6px; margin-left: 6px; letter-spacing: 0; }
  .muted { color:#888; font-size:13px; }
  .tl-item { display:flex; gap:10px; padding:8px 4px; border-bottom:1px solid #eee; font-size:13px; }
  .tl-date { color:#888; font-size:12px; white-space:nowrap; min-width:88px; }
  .tl-conn .tl-body { color:#1a6a3a; }
  .tl-sub { margin:3px 0; font-size:12px; line-height:1.6; }
  .tl-snap summary { cursor:pointer; color:#1a3a5c; }

  /* shared accordion */
  details.detail-block { margin: 16px 0; border: 1px solid #e0e0e0; border-radius: 6px; }
  details.detail-block > summary { cursor: pointer; padding: 10px 14px; font-size: 13px; color: #555; user-select: none; }
  details.detail-block > summary:hover { background: #f7f7f7; border-radius: 6px; }
  .detail-inner { padding: 12px 16px 16px; }
  .keys-label, .traj-label { font-size: 11px; font-weight: bold; color: #555; margin-bottom: 8px; }
  .key-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .key-tag  { background: #f0f4ff; border: 1px solid #c5d3f0; color: #1a3a8c; border-radius: 20px; padding: 3px 12px; font-size: 12px; }
  .traj-item  { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; font-size: 13px; }
  .traj-from  { background: #f5f5f5; border-radius: 4px; padding: 4px 10px; color: #444; flex: 1; }
  .traj-arrow { color: #aaa; flex-shrink: 0; padding-top: 4px; }
  .traj-to    { background: #eaf4ea; border-radius: 4px; padding: 4px 10px; color: #1a5c1a; flex: 1; }

  /* connect */
  .connect-block { margin: 28px 0 8px; }
  .want-row  { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .want-label { font-size: 12px; color: #555; }
  .want-select { font-size: 13px; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; }
  .btn { padding: 9px 22px; cursor: pointer; border: none; border-radius: 5px; font-size: 14px; font-weight: bold; }
  .btn-connect { background: #1a3a5c; color: white; }
  .btn-connect:hover { background: #122840; }
  .btn-msg { background: #f0f0f0; border: 1px solid #ccc; color: #333; }
  .btn-msg:hover { background: #e4e4e4; }
  #notice { margin-top: 10px; font-size: 13px; }
  .ok  { color: #1a8a1a; font-weight: bold; }
  .err { color: #c00; }
  #loading { color: #888; margin-top: 40px; }

  @media (max-width: 600px) {
    .state-grid { grid-template-columns: 1fr; }
    .triangle-block { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
{% include "_nav.html" %}
<a href="/" class="back">← トップに戻る</a>
<div id="loading">読み込み中...</div>
<div id="main" style="display:none">

  <div id="profileBlock"></div>

  <!-- accordion: keys + trajectory -->
  <details class="detail-block" id="detailBlock" style="display:none">
    <summary id="detailSummary">詳細・軌跡を見る</summary>
    <div class="detail-inner" id="detailInner"></div>
  </details>

  <!-- connect actions -->
  <div class="connect-block" id="connectBlock" style="display:none">
    <h2>つながる</h2>
    <div class="want-row">
      <span class="want-label">マッチングの方向性：</span>
      <select class="want-select" id="wantMode">
        <option value="complement">補完（現状・役割が違う人）</option>
        <option value="similar">共鳴（意志が近い人）</option>
        <option value="balanced" selected>バランス（両方）</option>
      </select>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-connect" onclick="doConnect()">この人とつながる</button>
      <button class="btn btn-msg" onclick="sendMsg()">メッセージを送る</button>
    </div>
    <div id="notice"></div>
  </div>

  <div id="ownActions" style="display:none;margin-top:28px">
    <a id="mypageLink" href="#" style="padding:8px 18px;background:#f0f0f0;border:1px solid #ccc;color:#333;border-radius:4px;text-decoration:none;font-size:13px">マイページへ</a>
  </div>

  <h2 style="font-size:1.05rem;border-bottom:1px solid #ddd;padding-bottom:4px;margin-top:32px">軌跡</h2>
  <div id="timeline"><span class="muted">読み込み中…</span></div>

</div>

<script>
const pathParts = location.pathname.split("/");
const profileId = decodeURIComponent(pathParts[pathParts.length - 1]);
const myId = localStorage.getItem("pox_my_id");

if (myId && myId === profileId) {
  location.replace(`/mypage?id=${encodeURIComponent(myId)}`);
}

async function init() {
  const res = await fetch(`/api/profile/${encodeURIComponent(profileId)}`);
  if (!res.ok) {
    document.getElementById("loading").innerHTML =
      `<span style="color:#c00">プロフィール "${profileId}" が見つかりません。</span>`;
    return;
  }
  const pv = await res.json();
  document.getElementById("loading").style.display = "none";
  document.getElementById("main").style.display = "block";

  renderProfileView(pv);
  loadTimeline(profileId, myId);   // 第三者ビュー（viewer=自分）。接続は公開・evidence_span/数値は出ない

  if (myId && myId !== profileId) {
    document.getElementById("connectBlock").style.display = "block";
  } else if (!myId) {
    document.getElementById("connectBlock").style.display = "block";
  } else {
    const own = document.getElementById("ownActions");
    own.style.display = "block";
    document.getElementById("mypageLink").href = `/mypage?id=${encodeURIComponent(myId)}`;
  }
}

function renderProfileView(pv) {
  const container = document.getElementById("profileBlock");
  if (pv.schema_version === "v4") {
    container.innerHTML = renderV4(pv);
  } else {
    let html = "";
    if (pv.headline) html += `<p class="headline-text">${escHtml(pv.headline)}</p>`;
    container.innerHTML = html + renderV3(pv);
  }
}

/* ── v4.3 レイアウト（他人ビュー: 背景は大きく・本人より読み取り専用）── */
function renderV4(pv) {
  let h = "";

  const bg = pv.background || pv.headline || "";
  if (bg) h += `<p class="bg-text-lg">${escHtml(bg)}</p>`;

  const willWhere = pv.will_where || pv.pursuing || "";
  h += `<section class="pblock"><div class="block-heading">意志</div>`;
  h += tierHtml("いま目指していること", willWhere);
  if (pv.will_why)    h += tierHtml("その根にある捉え方", pv.will_why);
  if (pv.will_origin) h += tierHtml("そう考えるに至った経験", pv.will_origin);
  h += `</section>`;

  const slots = [
    ["持っているもの", pv.state_have],
    ["繰り返し現れる固有の型", pv.state_can_type],
    ["縛られているもの", pv.state_bound],
  ];
  if (slots.some(s => s[1]) || pv.state_unsorted) {
    h += `<section class="pblock"><div class="block-heading">現状</div>`;
    for (const [label, val] of slots) h += slotHtml(label, val || "—");
    if (pv.state_unsorted) h += slotHtml("その他", pv.state_unsorted);
    h += `</section>`;
  }

  const seekingText = (pv.seeking && pv.seeking !== "未取得") ? pv.seeking : "";
  h += `<section class="pblock"><div class="block-heading">足りないもの</div>`;
  h += `<div class="slot"><span class="slot-label">次の一歩</span>${trajInlineHtml(pv.trajectory)}</div>`;
  h += slotHtml("求めている（本人の言葉）", seekingText || "—");
  h += `</section>`;

  // 必要としている相手（②生成の必要像・AIの仮説）。本人申告の「求めている」とは別物。
  if (pv.necessity_text) {
    h += `<section class="pblock">
      <div class="block-heading">必要としている相手 <span class="ai-note">AIによる推定</span></div>
      <p class="slot-text">${escHtml(pv.necessity_text)}</p></section>`;
  }

  // 本人より（自由記述）— 他人ビューは読み取り専用・空なら非表示
  const free = (pv.free_text || "").trim();
  if (free) {
    h += `<section class="pblock"><div class="block-heading">本人より</div>
      <p class="freetext-ro">${escHtml(free)}</p></section>`;
  }
  return h;
}

function tierHtml(label, val) {
  return `<div class="tier"><span class="tier-label">${escHtml(label)}</span>
    <p class="tier-text">${escHtml(val || "—")}</p></div>`;
}
function slotHtml(label, val) {
  return `<div class="slot"><span class="slot-label">${escHtml(label)}</span>
    <p class="slot-text">${escHtml(val)}</p></div>`;
}
function trajInlineHtml(trajectory) {
  if (!trajectory || !trajectory.length) return `<p class="slot-text">—</p>`;
  return trajectory.map(t => `<div class="traj-item">
    <span class="traj-from">${escHtml(t.from)}</span>
    <span class="traj-arrow">→</span>
    <span class="traj-to">${escHtml(t.to)}</span>
  </div>`).join("");
}

/* ── v3 後方互換（現状維持・detailBlock アコーディオンを使う）── */
function renderV3(pv) {
  let h = "";
  const badge = pv.phase_badge || {};
  if (badge.value) {
    h += `<div class="phase-badge">
      <span class="phase-tag">${escHtml(badge.value)}</span>
      ${badge.unconfirmed ? '<span class="phase-unconfirmed">AI推定・未確定</span>' : ""}
    </div>`;
  }
  h += `<div class="triangle-block">
    <div class="tri-item"><span class="tri-label">意志</span><p class="tri-text">${escHtml(pv.pursuing || "—")}</p></div>
    <div class="tri-item"><span class="tri-label">求めている</span><p class="tri-text">${escHtml(pv.needs || "—")}</p></div>
    <div class="tri-item"><span class="tri-label">能力</span><p class="tri-text">${escHtml(pv.offering || "—")}</p></div>
  </div>`;
  const hasDetail = (pv.keys && pv.keys.length) || (pv.trajectory && pv.trajectory.length);
  if (hasDetail) {
    document.getElementById("detailBlock").style.display = "block";
    document.getElementById("detailSummary").textContent = "注目ポイント・軌跡を見る";
    document.getElementById("detailInner").innerHTML =
      buildKeysHtml(pv.keys) + buildTrajHtml(pv.trajectory);
  }
  return h;
}

function buildKeysHtml(keys) {
  if (!keys || !keys.length) return "";
  return `<div><div class="keys-label">注目ポイント</div>
    <div class="key-tags">${keys.map(k => `<span class="key-tag">${escHtml(k)}</span>`).join("")}</div></div>`;
}

function buildTrajHtml(trajectory) {
  if (!trajectory || !trajectory.length) return "";
  return `<div><div class="traj-label">現在の軌跡</div>
    ${trajectory.map(t => `<div class="traj-item">
      <span class="traj-from">${escHtml(t.from)}</span>
      <span class="traj-arrow">→</span>
      <span class="traj-to">${escHtml(t.to)}</span>
    </div>`).join("")}</div>`;
}

async function doConnect() {
  if (!myId) {
    alert("マイページでIDを設定してから接続してください");
    location.href = "/mypage";
    return;
  }
  const notice = document.getElementById("notice");
  const want = document.getElementById("wantMode").value;
  notice.textContent = "マッチング中...";
  notice.className = "";

  const mRes = await fetch("/match", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ seeker_id: myId, want }),
  });
  const mData = await mRes.json();
  if (!mRes.ok) {
    notice.className = "err";
    notice.textContent = "マッチングエラー: " + (mData.error || JSON.stringify(mData));
    return;
  }

  const matchRunId = mData.match_run_id;
  const ranking = mData.ranking || [];
  const matchEntry = ranking.find(r => r.id === profileId);
  const predictedRole = matchEntry?.predicted_role || null;

  const aRes = await fetch("/approve", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ from_id: myId, to_id: profileId, match_run_id: matchRunId, predicted_role: predictedRole }),
  });
  const aData = await aRes.json();
  if (!aRes.ok) {
    notice.className = "err";
    notice.textContent = "接続エラー: " + (aData.error || JSON.stringify(aData));
    return;
  }

  if (aData.established) {
    notice.className = "ok";
    notice.textContent = `🎉 接続成立！ vessel: ${aData.vessel_id}`;
  } else {
    notice.className = "ok";
    notice.textContent = `✅ 接続を申請しました（vessel: ${aData.vessel_id}）。相手の承認をお待ちください。`;
  }
}

function sendMsg() {
  if (!myId) { alert("マイページでIDを設定してください"); return; }
  location.href = `/conversation?me=${encodeURIComponent(myId)}&with=${encodeURIComponent(profileId)}`;
}

function escHtml(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/* 軌跡（第三者/当事者の相手ビュー）: 公開範囲はサーバーが閲覧者役割で絞る。
   接続は成立/終了の「事実」のみ・理由なし。evidence_span/数値は出ない。
   第三者に伏せられた時点は「非公開」表示（事実は残る）。 */
async function loadTimeline(userId, viewer) {
  const el = document.getElementById("timeline");
  if (!el) return;
  let data;
  try {
    const q = viewer ? `?viewer=${encodeURIComponent(viewer)}` : "";
    data = await (await fetch(`/api/timeline/${encodeURIComponent(userId)}${q}`)).json();
  } catch (e) { el.innerHTML = `<span class="muted">軌跡を読み込めませんでした。</span>`; return; }
  const items = (data && data.items) || [];
  if (!items.length) { el.innerHTML = `<span class="muted">まだ軌跡はありません。</span>`; return; }
  el.innerHTML = items.map(it => {
    const d = it.at ? new Date(it.at).toLocaleDateString("ja-JP") : "";
    if (it.kind === "connection") {
      const label = it.event === "established" ? "接続成立" : (it.event === "ended" ? "接続終了" : escHtml(it.event || ""));
      const other = it.other || "?";
      return `<div class="tl-item tl-conn"><span class="tl-date">${escHtml(d)}</span>
        <span class="tl-body"><a href="/profile/${encodeURIComponent(other)}">${escHtml(other)}</a> と${label}</span></div>`;
    }
    if (it.hidden) {
      return `<div class="tl-item tl-snap"><span class="tl-date">${escHtml(d)}</span>
        <div class="tl-body"><span class="muted">この時点の内容は非公開です</span></div></div>`;
    }
    const will = it.will_text ? `<div class="tl-sub"><b>意志:</b> ${escHtml(it.will_text)}</div>` : "";
    const nec  = it.necessity_text ? `<div class="tl-sub"><b>必要としている相手:</b> ${escHtml(it.necessity_text)}</div>` : "";
    return `<div class="tl-item tl-snap"><span class="tl-date">${escHtml(d)}</span>
      <div class="tl-body"><details><summary>プロフィールを更新</summary>${will}${nec}</details></div></div>`;
  }).join("");
}

init();
</script>
</body>
</html>
